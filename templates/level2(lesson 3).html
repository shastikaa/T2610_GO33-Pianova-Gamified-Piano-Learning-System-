<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pianova | Note Quest</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --gold: #f1b842;
      --gold-soft: #ffe3a1;
      --cream: #fff2df;
      --ink: #07080a;
      --panel: #0b0d10;
      --line: rgba(255, 255, 255, 0.1);
      --red: #ff5b70;
      --green: #9af077;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(circle at 12% 50%, rgba(241, 184, 66, 0.12), transparent 28%),
        radial-gradient(circle at 92% 35%, rgba(241, 184, 66, 0.14), transparent 24%),
        linear-gradient(90deg, #050503, #151006 18%, #030303 50%, #151006 82%, #050503);
    }

    .page {
      width: min(1080px, 100vw);
      height: 100vh;
      margin: 0 auto;
      padding: clamp(8px, 1.5vh, 16px) clamp(10px, 2vw, 18px);
      display: grid;
      grid-template-rows: clamp(56px, 7vh, 72px) clamp(64px, 10vh, 88px) minmax(0, 1fr);
      gap: 10px;
      position: relative;
    }

    .bg-note {
      position: fixed;
      color: rgba(241, 184, 66, 0.13);
      font-size: clamp(4rem, 10vw, 9rem);
      font-weight: 900;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(241, 184, 66, 0.16);
    }

    .bg-note.one { left: 2vw; top: 36vh; }
    .bg-note.two { right: 5vw; top: 32vh; }
    .bg-note.three { left: 4vw; bottom: 7vh; font-size: 4rem; }
    .bg-note.four { right: 8vw; bottom: 14vh; font-size: 5rem; }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 108px;
      align-items: center;
      gap: 14px;
      min-height: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-icon,
    .circle-btn,
    .stat-icon,
    .mini-icon {
      display: grid;
      place-items: center;
      border: 1px solid rgba(241, 184, 66, 0.56);
      background: linear-gradient(145deg, #191b20, #060608);
      box-shadow: inset 0 0 14px rgba(255, 227, 161, 0.04), 0 0 20px rgba(241, 184, 66, 0.08);
    }

    .brand-icon {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      color: white;
      font-size: 1.9rem;
    }

    .brand h1 {
      color: var(--gold-soft);
      font-size: clamp(1.8rem, 3.2vw, 2.7rem);
      line-height: 1;
      font-family: Georgia, "Times New Roman", serif;
      white-space: nowrap;
      text-shadow: 0 0 16px rgba(241, 184, 66, 0.28);
    }

    .brand p {
      color: #dcc8a4;
      margin-top: 4px;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 58px;
      padding: 8px 12px;
      border-radius: 20px;
      background: rgba(3, 4, 6, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
    }

    .nav button {
      height: 42px;
      padding: 0 14px;
      border: 0;
      border-radius: 14px;
      color: #f4ead9;
      background: transparent;
      font-size: 0.96rem;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .nav button.active {
      color: var(--gold-soft);
      background: linear-gradient(145deg, rgba(241, 184, 66, 0.24), rgba(51, 35, 12, 0.72));
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .circle-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      color: var(--gold-soft);
      font-size: 1.25rem;
      cursor: pointer;
      border: 1px solid rgba(241, 184, 66, 0.24);
      background: linear-gradient(145deg, #191b20, #060608);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .circle-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 18px rgba(241, 184, 66, 0.18);
    }

    .exit-btn {
      color: #ff7b7b;
      border-color: rgba(255, 91, 112, 0.45);
      background: linear-gradient(145deg, rgba(255, 91, 112, 0.17), rgba(35, 0, 0, 0.18));
    }

    .exit-btn:hover {
      background: linear-gradient(145deg, rgba(255, 91, 112, 0.24), rgba(40, 5, 5, 0.22));
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      min-height: 0;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(15, 17, 20, 0.98), rgba(7, 8, 10, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.32);
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      min-width: 0;
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat-icon {
      width: 62px;
      height: 62px;
      flex: 0 0 auto;
      border-radius: 50%;
      color: white;
      font-size: 1.8rem;
    }

    .stat-icon.danger {
      border-color: rgba(255, 91, 112, 0.62);
    }

    .stat-label {
      color: #f7efe1;
      font-size: 0.98rem;
      font-weight: 900;
    }

    .stat-value {
      margin-top: 6px;
      color: var(--gold-soft);
      font-size: 1.45rem;
      font-weight: 900;
      font-family: Georgia, "Times New Roman", serif;
    }

    .combo-text {
      color: #ffd46e;
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      margin-left: 6px;
    }

    .hearts {
      color: var(--red);
      letter-spacing: 0.16em;
      text-shadow: 0 0 10px rgba(255, 91, 112, 0.45);
      white-space: nowrap;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .progress {
      width: 120px;
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #202329;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), #fff0b0);
      box-shadow: 0 0 10px rgba(241, 184, 66, 0.7);
      transition: width 0.25s ease;
    }

    .game-card {
      position: relative;
      min-height: 0;
      padding: clamp(14px, 1.8vh, 22px) clamp(14px, 2vw, 20px) clamp(12px, 1.2vh, 16px);
      border-radius: 34px 34px 28px 28px;
      background: linear-gradient(180deg, rgba(10, 12, 15, 0.98), rgba(2, 3, 4, 0.98));
      border: 1px solid rgba(241, 184, 66, 0.62);
      box-shadow:
        0 0 0 1px rgba(255, 227, 161, 0.04),
        0 0 30px rgba(241, 184, 66, 0.14),
        inset 0 0 34px rgba(255, 227, 161, 0.03);
      display: grid;
      grid-template-rows: auto auto minmax(100px, 1fr) minmax(110px, 1fr) auto;
      gap: 12px;
      overflow: hidden;
    }

    .ribbon {
      position: absolute;
      top: 0;
      left: 50%;
      width: 156px;
      height: 48px;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      color: #f7ead1;
      background: linear-gradient(180deg, #15130f, #08090a);
      border: 1px solid rgba(241, 184, 66, 0.58);
      border-top: 0;
      clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%);
      font-size: 1rem;
      font-weight: 900;
      z-index: 2;
    }

    .game-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .title-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mini-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      color: white;
      font-size: 1.8rem;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .title-block h2 {
      color: var(--gold-soft);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 2.9vw, 2.2rem);
      line-height: 1;
    }

    .title-block p {
      margin-top: 6px;
      color: white;
      font-size: 1rem;
      font-weight: 800;
    }

    .lesson-btn {
      padding: 12px 18px;
      border-radius: 16px;
      color: var(--gold-soft);
      background: rgba(17, 18, 21, 0.84);
      border: 1px solid rgba(241, 184, 66, 0.46);
      font-size: 0.95rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .instruction {
      display: grid;
      place-items: center;
      color: var(--gold-soft);
      text-align: center;
      font-size: clamp(1rem, 2vw, 1.4rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      text-shadow: 0 0 10px rgba(241, 184, 66, 0.24);
      padding: 0 8px;
    }

    .staff-shell {
      display: grid;
      place-items: center;
      padding: 10px;
      border-radius: 18px;
      background: linear-gradient(180deg, #25272c, #131518);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02);
      min-height: 0;
    }

    .staff-paper {
      position: relative;
      width: min(740px, 94%);
      height: 100%;
      min-height: 110px;
      border-radius: 14px;
      background: linear-gradient(180deg, #f8ebdd, #e6d7c4);
      box-shadow: inset 0 0 20px rgba(74, 48, 18, 0.1), 0 10px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .staff-lines {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 28%;
      height: 44%;
    }

    .staff-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(15, 15, 15, 0.7);
    }

    .clef {
      position: absolute;
      left: 4%;
      top: 50%;
      transform: translateY(-50%);
      color: #222;
      font-size: clamp(3rem, 8vh, 5rem);
      line-height: 1;
    }

    .note-wrap {
      position: absolute;
      left: 54%;
      width: 60px;
      height: 60px;
      transform: translate(-50%, -50%);
      transition: top 0.22s ease;
    }

    .note-head {
      position: absolute;
      left: 12px;
      top: 22px;
      width: 36px;
      height: 22px;
      border-radius: 50%;
      background: #111;
      transform: rotate(-16deg);
    }

    .note-stem {
      position: absolute;
      left: 48px;
      top: -10px;
      width: 4px;
      height: 62px;
      background: #111;
      border-radius: 4px;
    }

    .ledger {
      position: absolute;
      left: 4px;
      width: 52px;
      height: 2px;
      background: #111;
    }

    .accidental {
      position: absolute;
      left: -20px;
      top: 18px;
      color: #333;
      font-size: 1.8rem;
      font-weight: 900;
    }

    .piano-shell {
      padding: 10px 12px 0;
      border-radius: 20px;
      background: #0f1114;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      min-height: 0;
    }

    .piano {
      --white-count: 8;
      position: relative;
      height: 100%;
      min-height: 120px;
      display: grid;
      grid-template-columns: repeat(var(--white-count), 1fr);
      overflow: hidden;
      border-radius: 16px 16px 0 0;
      background: #f8f0e4;
      box-shadow: 0 16px 28px rgba(0, 0, 0, 0.38);
    }

    .white-key,
    .black-key {
      position: relative;
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .white-key {
      z-index: 1;
      background: linear-gradient(90deg, #eadcc5, #fff7ea 20%, #f0e1c9 82%, #a69a87);
      border-right: 2px solid rgba(49, 36, 19, 0.42);
      box-shadow: inset 0 -14px 20px rgba(50, 34, 16, 0.18);
    }

    .black-key {
      position: absolute;
      z-index: 4;
      top: 0;
      width: 8.7%;
      height: 60%;
      transform: translateX(-50%);
      border-radius: 0 0 8px 8px;
      background: linear-gradient(90deg, #040405, #15171b 50%, #000);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 7px 0 #000, 0 14px 24px rgba(0, 0, 0, 0.72);
    }

    .key-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      color: #0b0a08;
      text-align: center;
      font-size: clamp(1.1rem, 2.2vw, 1.75rem);
      font-weight: 900;
      pointer-events: none;
    }

    .black-key .key-label {
      top: 48%;
      bottom: auto;
      color: var(--gold-soft);
      font-size: clamp(0.78rem, 1.4vw, 1.05rem);
    }

    .white-key.next,
    .black-key.next {
      box-shadow: inset 0 0 32px rgba(241, 184, 66, 0.58), 0 0 24px rgba(241, 184, 66, 0.5);
      filter: brightness(1.08);
    }

    .white-key.active,
    .black-key.active {
      transform: translateY(5px);
      filter: brightness(1.18);
    }

    .black-key.active {
      transform: translateX(-50%) translateY(5px);
    }

    .white-key.wrong,
    .black-key.wrong {
      box-shadow: inset 0 0 34px rgba(255, 91, 112, 0.76), 0 0 24px rgba(255, 91, 112, 0.62);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .btn {
      min-width: 124px;
      padding: 10px 18px;
      border: 1px solid rgba(241, 184, 66, 0.58);
      border-radius: 15px;
      color: var(--gold-soft);
      background: rgba(11, 12, 15, 0.9);
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
    }

    .btn.primary {
      color: #150d03;
      background: linear-gradient(135deg, #fff0b4, var(--gold) 58%, #a66c20);
    }

    .feedback {
      min-width: 220px;
      color: #f7ead1;
      text-align: center;
      font-weight: 900;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    @media (max-width: 980px) {
      .page {
        grid-template-rows: 76px 92px 1fr;
        padding: 10px;
        gap: 9px;
      }

      .topbar {
        grid-template-columns: 1fr auto;
      }

      .nav {
        display: none;
      }

      .scoreboard {
        grid-template-columns: repeat(4, 1fr);
      }

      .stat {
        padding: 10px;
        gap: 8px;
      }

      .stat-icon {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
      }

      .stat-label {
        font-size: 0.74rem;
      }

      .stat-value {
        font-size: 1rem;
      }

      .combo-text {
        display: none;
      }

      .game-card {
        padding: 24px 16px 16px;
        border-radius: 28px;
        grid-template-rows: 62px 38px 170px minmax(150px, 1fr) 44px;
        gap: 9px;
      }

      .ribbon {
        width: 132px;
        height: 40px;
        font-size: 0.86rem;
      }

      .title-block {
        gap: 10px;
      }

      .mini-icon {
        width: 48px;
        height: 48px;
      }

      .title-block p,
      .lesson-btn {
        display: none;
      }

      .staff-paper {
        width: 96%;
      }
    }

    @media (max-width: 640px) {
      .page {
        grid-template-rows: 64px 76px 1fr;
      }

      .brand-icon {
        width: 48px;
        height: 48px;
      }

      .brand h1 {
        font-size: 1.7rem;
      }

      .brand p,
      .top-actions {
        display: none;
      }

      .stat:nth-child(2),
      .stat:nth-child(3) {
        display: none;
      }

      .scoreboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .game-card {
        grid-template-rows: 50px 34px 150px minmax(140px, 1fr) 42px;
      }

      .staff-shell {
        padding: 10px;
      }

      .piano-shell {
        padding: 10px 10px 0;
      }

      .black-key {
        width: 9.4%;
      }

      .controls {
        gap: 8px;
      }

      .btn {
        min-width: 96px;
        padding: 9px 10px;
      }
    }

    @media (max-height: 780px) {
      .page {
        padding: 8px 10px;
        grid-template-rows: 60px 84px minmax(0, 1fr);
      }

      .game-card {
        padding: 14px 14px 16px;
        grid-template-rows: auto auto minmax(100px, 1fr) minmax(120px, 1fr) auto;
        gap: 10px;
      }

      .staff-paper {
        min-height: 100px;
      }

      .piano {
        min-height: 120px;
      }

      .note-wrap {
        width: 62px;
        height: 62px;
      }

      .note-head {
        left: 10px;
        top: 22px;
        width: 34px;
        height: 22px;
      }

      .title-block h2 {
        font-size: 1.8rem;
      }

      .controls {
        gap: 6px;
      }

      .btn {
        min-width: 82px;
        padding: 8px 10px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-note one">&#119070;</div>
  <div class="bg-note two">&#9835;</div>
  <div class="bg-note three">&#9834;</div>
  <div class="bg-note four">&#9833;</div>

  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">▥</div>
        <div>
          <h1>Pianova♪</h1>
          <p>Play • Learn • Master</p>
        </div>
      </div>

      <nav class="nav" aria-label="Game navigation">
        <button class="active">⌂ Home</button>
        <button>♕ Leaderboard</button>
        <button>♙ Profile</button>
      </nav>

      <div class="top-actions">
        <button class="circle-btn exit-btn" id="exitBtn">⏻</button>
        <button class="circle-btn" id="soundBtn">♪</button>
        <button class="circle-btn" id="shuffleBtn">⚙</button>
      </div>
    </header>

    <section class="scoreboard">
      <article class="stat">
        <div class="stat-icon">★</div>
        <div>
          <div class="stat-label">Score</div>
          <div class="stat-value" id="scoreValue">0</div>
        </div>
      </article>
      <article class="stat">
        <div class="stat-icon">♨</div>
        <div>
          <div class="stat-label">Combo</div>
          <div class="stat-value"><span id="comboValue">0</span><span class="combo-text" id="comboText">Keep going!</span></div>
        </div>
      </article>
      <article class="stat">
        <div class="stat-icon danger">♥</div>
        <div>
          <div class="stat-label">Lives</div>
          <div class="stat-value hearts" id="livesValue">♥♥♥♥♥</div>
        </div>
      </article>
      <article class="stat">
        <div>
          <div class="stat-label">Level <span id="levelValue">1</span></div>
          <div class="progress-row">
            <div class="progress"><span id="progressFill"></span></div>
            <div class="stat-value" id="progressText">0%</div>
          </div>
        </div>
      </article>
    </section>

    <section class="game-card">
      <div class="ribbon">LESSON <span id="lessonRibbon">3</span></div>

      <div class="game-head">
        <div class="title-block">
          <div class="mini-icon">▥</div>
          <div>
            <h2>Pianova</h2>
            <p>Identify the note</p>
          </div>
        </div>
        <button class="lesson-btn">♫ <span id="lessonTitle">SHARP CHALLENGE</span> ▾</button>
      </div>

      <div class="instruction">Click the matching piano key</div>

      <div class="staff-shell">
        <div class="staff-paper">
          <div class="staff-lines">
            <div class="staff-line" style="top:0%"></div>
            <div class="staff-line" style="top:25%"></div>
            <div class="staff-line" style="top:50%"></div>
            <div class="staff-line" style="top:75%"></div>
            <div class="staff-line" style="top:100%"></div>
          </div>
          <div class="clef">&#119070;</div>
          <div class="note-wrap" id="noteWrap">
            <div class="accidental" id="accidental"></div>
            <div class="note-head"></div>
            <div class="note-stem"></div>
          </div>
        </div>
      </div>

      <div class="piano-shell">
        <div class="piano" id="piano"></div>
      </div>

      <div class="controls">
        <button class="btn primary" id="hearBtn">Hear Note</button>
        <div class="feedback" id="feedback">Random note ready</div>
        <button class="btn" id="restartBtn">Restart</button>
      </div>
    </section>
  </main>

  <script>
    let audioCtx = null;

    const MAX_LIVES = 5;
    const QUESTIONS_PER_LEVEL = 10;
    const whiteKeys = [
      { note: "C4", name: "C", key: "a" },
      { note: "D4", name: "D", key: "s" },
      { note: "E4", name: "E", key: "d" },
      { note: "F4", name: "F", key: "f" },
      { note: "G4", name: "G", key: "g" },
      { note: "A4", name: "A", key: "h" },
      { note: "B4", name: "B", key: "j" },
      { note: "C5", name: "C", key: "k" }
    ];

    const blackKeys = [
      { note: "C#4", name: "C#", key: "w", after: 1 },
      { note: "D#4", name: "D#", key: "e", after: 2 },
      { note: "F#4", name: "F#", key: "t", after: 4 },
      { note: "G#4", name: "G#", key: "y", after: 5 },
      { note: "A#4", name: "A#", key: "u", after: 6 }
    ];

    const levels = [
      { title: "LESSON 1", notes: ["C", "D", "E", "F", "G"] },
      { title: "LESSON 2", notes: ["C", "D", "E", "F", "G", "A", "B"] },
      { title: "SHARP CHALLENGE", notes: ["C", "D", "E", "F", "G", "A", "B", "C#", "D#", "F#", "G#", "A#"] }
    ];

    const freqs = {
      C4: 261.63, "C#4": 277.18, D4: 293.66, "D#4": 311.13, E4: 329.63,
      F4: 349.23, "F#4": 369.99, G4: 392.00, "G#4": 415.30, A4: 440.00,
      "A#4": 466.16, B4: 493.88, C5: 523.25
    };

    const staffTop = {
      C: 88,
      D: 82,
      E: 73,
      F: 69,
      G: 62,
      A: 56,
      B: 50,
      "C#": 88,
      "D#": 82,
      "F#": 69,
      "G#": 62,
      "A#": 56
    };

    const DEFAULT_LEVEL = 2;
    let score = 0;
    let combo = 0;
    let lives = MAX_LIVES;
    let levelIndex = DEFAULT_LEVEL;
    let question = 0;
    let target = null;
    let previousTarget = null;

    const piano = document.getElementById("piano");
    const noteWrap = document.getElementById("noteWrap");
    const accidental = document.getElementById("accidental");
    const feedback = document.getElementById("feedback");

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playNote(note) {
      const key = whiteKeys.concat(blackKeys).find(item => item.name === note);
      const ctx = initAudio();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freqs[key?.note || "C4"];
      gain.gain.setValueAtTime(0.42, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(now + 0.55);
    }

    function playTone(freq, type = "sine") {
      const ctx = initAudio();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(now + 0.22);
    }

    function renderPiano() {
      const whites = whiteKeys.map(item => `
        <button class="white-key" data-note="${item.name}" type="button">
          <span class="key-label">${item.name}</span>
        </button>
      `).join("");

      const blacks = blackKeys.map(item => `
        <button class="black-key" data-note="${item.name}" type="button" style="left:${(item.after / whiteKeys.length) * 100}%">
          <span class="key-label">${item.name}</span>
        </button>
      `).join("");

      piano.innerHTML = whites + blacks;
      piano.querySelectorAll("[data-note]").forEach(key => {
        key.addEventListener("click", () => answer(key.dataset.note, key));
      });
    }

    function randomTarget() {
      const choices = levels[levelIndex].notes;
      let next = choices[Math.floor(Math.random() * choices.length)];
      if (choices.length > 1) {
        while (next === previousTarget) {
          next = choices[Math.floor(Math.random() * choices.length)];
        }
      }
      previousTarget = next;
      return next;
    }

    function newQuestion() {
      target = randomTarget();
      noteWrap.style.top = `${staffTop[target]}%`;
      accidental.textContent = target.includes("#") ? "#" : "";
      updateHud();
    }

    function highlightKeys() {
      // Clue highlighting disabled for Lesson 3.
    }

    function answer(note, keyEl) {
      initAudio();
      playNote(note);
      keyEl.classList.add("active");
      setTimeout(() => keyEl.classList.remove("active"), 160);

      if (note === target) {
        score += 100 + Math.min(combo, 10) * 10;
        combo += 1;
        question += 1;
        playTone(988);
        setFeedback("Correct!", "good");

        if (question >= QUESTIONS_PER_LEVEL) {
          nextLevel();
          return;
        }

        newQuestion();
        return;
      }

      lives -= 1;
      combo = 0;
      playTone(180, "sawtooth");
      keyEl.classList.add("wrong");
      setTimeout(() => keyEl.classList.remove("wrong"), 240);
      setFeedback(`Wrong. Try ${target}.`, "bad");

      if (lives <= 0) {
        restart("Game over. Try again.");
        return;
      }

      updateHud();
    }

    function nextLevel() {
      if (levelIndex >= levels.length - 1) {
        restart("You finished all lessons!");
        return;
      }

      levelIndex += 1;
      question = 0;
      combo = 0;
      setFeedback(`Level ${levelIndex + 1}`, "good");
      newQuestion();
      playTone(784);
    }

    function updateHud() {
      const progress = Math.round((question / QUESTIONS_PER_LEVEL) * 100);
      document.getElementById("scoreValue").textContent = score;
      document.getElementById("comboValue").textContent = combo;
      document.getElementById("comboText").textContent = combo >= 5 ? "Excellent!" : "Keep going!";
      document.getElementById("livesValue").textContent = "♥".repeat(lives) + "♡".repeat(MAX_LIVES - lives);
      document.getElementById("levelValue").textContent = levelIndex + 1;
      document.getElementById("lessonRibbon").textContent = levelIndex + 1;
      document.getElementById("lessonTitle").textContent = levels[levelIndex].title;
      document.getElementById("progressFill").style.width = `${progress}%`;
      document.getElementById("progressText").textContent = `${progress}%`;
    }

    function setFeedback(text, type) {
      feedback.textContent = text;
      feedback.className = `feedback ${type || ""}`;
      setTimeout(() => {
        if (feedback.textContent === text) {
          feedback.textContent = "Random note ready";
          feedback.className = "feedback";
        }
      }, 850);
    }

    function restart(message = "Random note ready") {
      score = 0;
      combo = 0;
      lives = MAX_LIVES;
      levelIndex = DEFAULT_LEVEL;
      question = 0;
      previousTarget = null;
      setFeedback(message, message.includes("over") ? "bad" : "good");
      newQuestion();
    }

    window.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      const found = whiteKeys.concat(blackKeys).find(item => item.key === key);
      if (!found) return;
      const keyEl = document.querySelector(`[data-note="${found.name}"]`);
      event.preventDefault();
      answer(found.name, keyEl);
    });

    document.getElementById("hearBtn").addEventListener("click", () => {
      initAudio();
      playNote(target);
    });

    document.getElementById("restartBtn").addEventListener("click", () => restart());
    document.getElementById("shuffleBtn").addEventListener("click", () => newQuestion());
    document.getElementById("soundBtn").addEventListener("click", () => playNote(target));
    document.getElementById("exitBtn").addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    });

    renderPiano();
    restart();
  </script>
</body>
</html>
