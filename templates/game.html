<!DOCTYPE html>
<html>
<head>
    <title>Piano Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>🎮 Piano Game</h1>

<p>Select the correct note: <b>C</b></p>

<form method="POST" style="display: inline;">
    <button name="note" value="C">C</button>
    <button name="note" value="D">D</button>
    <button name="note" value="E">E</button>
</form>

<p>{{ message }}</p>

<br>
<a href="/lessons">Back to Lessons</a>
<button onclick="quitGame()" style="padding: 10px 20px; background-color: #ff4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 10px;">Quit</button>

<script>
  function quitGame() {
    if (confirm('Are you sure you want to quit? Your progress will not be saved.')) {
      window.location.href = '/';
    }
  }
</script>

</body>
</html>
