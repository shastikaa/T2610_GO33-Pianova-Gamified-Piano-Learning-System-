<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pianova | Level 2 Lesson 4</title>
	<style>
		:root {
			--bg: #07090c;
			--panel: rgba(18, 22, 28, 0.92);
			--gold: #f2bd57;
			--text: #fff5e6;
			--muted: #d9c6a6;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			min-height: 100vh;
			display: grid;
			place-items: center;
			background:
				radial-gradient(circle at 10% 20%, rgba(242, 189, 87, 0.18), transparent 30%),
				radial-gradient(circle at 90% 80%, rgba(242, 189, 87, 0.15), transparent 35%),
				var(--bg);
			color: var(--text);
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			padding: 20px;
		}

		.card {
			width: min(680px, 100%);
			background: var(--panel);
			border: 1px solid rgba(242, 189, 87, 0.45);
			border-radius: 18px;
			padding: 28px;
			text-align: center;
			box-shadow: 0 14px 40px rgba(0, 0, 0, 0.42);
		}

		h1 { color: var(--gold); font-size: 2rem; margin-bottom: 10px; }
		p { color: var(--muted); line-height: 1.6; margin-bottom: 20px; }

		.actions {
			display: flex;
			justify-content: center;
			gap: 12px;
			flex-wrap: wrap;
		}

		.btn {
			border: 0;
			border-radius: 999px;
			padding: 12px 20px;
			font-weight: 700;
			cursor: pointer;
		}

		.btn-primary {
			color: #22180a;
			background: linear-gradient(180deg, #ffe6a7, #f2bd57);
		}

		.btn-secondary {
			color: var(--text);
			border: 1px solid rgba(255, 255, 255, 0.28);
			background: transparent;
		}
	</style>
</head>
<body>
	<main class="card">
		<h1>Level 2 - Lesson 4</h1>
		<p>
			Great progress. This lesson is now placed after your new game flow.
			Click Start Challenge to continue into the next piano challenge.
		</p>
		<div class="actions">
			<button class="btn btn-primary" onclick="window.location.href='/game2'">Start Challenge</button>
			<button class="btn btn-secondary" onclick="window.location.href='/lessons'">Back to Lessons</button>
		</div>
	</main>
</body>
</html>
