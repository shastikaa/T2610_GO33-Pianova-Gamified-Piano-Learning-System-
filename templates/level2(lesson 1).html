<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pianova | Creative Piano Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020303;
            --panel: rgba(6, 8, 11, 0.86);
            --panel-2: rgba(13, 15, 20, 0.9);
            --gold: #f1bd57;
            --gold-soft: #ffe29a;
            --gold-dark: #956122;
            --white-key: #fbf0de;
            --text: #fff7e8;
            --muted: #cdbb9d;
            --red: #ff5368;
            --green: #9be06e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Inter, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 8% 28%, rgba(242, 174, 56, 0.18), transparent 26%),
                radial-gradient(circle at 96% 46%, rgba(242, 174, 56, 0.23), transparent 25%),
                radial-gradient(circle at 50% 105%, rgba(130, 69, 21, 0.4), transparent 26%),
                #020303;
        }

        .stage {
            width: min(1180px, calc(100% - 32px));
            margin: 28px auto;
            position: relative;
            z-index: 1;
        }

        .music-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            color: rgba(241, 189, 87, 0.28);
            font-family: "Playfair Display", serif;
        }

        .music-bg span {
            position: absolute;
            font-size: clamp(2rem, 6vw, 6rem);
            filter: drop-shadow(0 0 16px rgba(241, 189, 87, 0.5));
            animation: floatNote 8s ease-in-out infinite;
        }

        .music-bg span:nth-child(1) { left: 2%; top: 34%; animation-delay: 0s; }
        .music-bg span:nth-child(2) { right: 2%; top: 30%; animation-delay: 1.2s; }
        .music-bg span:nth-child(3) { left: 4%; bottom: 12%; animation-delay: 2.2s; font-size: 2.6rem; }
        .music-bg span:nth-child(4) { right: 5%; bottom: 15%; animation-delay: 3s; font-size: 3.4rem; }

        @keyframes floatNote {
            0%, 100% { transform: translateY(0); opacity: 0.25; }
            50% { transform: translateY(-18px); opacity: 0.52; }
        }

        .topbar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 30px;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 250px;
        }

        .brand-mark {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: linear-gradient(145deg, #11161b, #050606);
            border: 1px solid rgba(241, 189, 87, 0.45);
            box-shadow: 0 0 24px rgba(241, 189, 87, 0.24), inset 0 0 22px rgba(255, 226, 154, 0.09);
            font-size: 1.7rem;
        }

        .brand-title {
            font-family: "Playfair Display", serif;
            font-size: 2.55rem;
            line-height: 0.95;
            color: var(--gold-soft);
            text-shadow: 0 0 18px rgba(241, 189, 87, 0.45);
        }

        .brand-sub {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.98rem;
            letter-spacing: 0.02em;
        }

        .nav {
            justify-self: center;
            display: flex;
            gap: 14px;
            padding: 8px;
            border-radius: 18px;
            background: rgba(5, 7, 10, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-btn,
        .icon-btn,
        .difficulty {
            border: 1px solid transparent;
            color: var(--text);
            background: transparent;
            font: inherit;
            cursor: pointer;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 13px 18px;
            border-radius: 15px;
            color: #ede8dd;
            font-weight: 600;
            white-space: nowrap;
        }

        .nav-btn.active {
            color: var(--gold-soft);
            background: linear-gradient(145deg, rgba(241, 189, 87, 0.18), rgba(255, 255, 255, 0.03));
            box-shadow: inset 0 0 18px rgba(241, 189, 87, 0.09);
        }

        .top-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .icon-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border-color: rgba(241, 189, 87, 0.65);
            color: var(--gold-soft);
            background: rgba(5, 6, 8, 0.62);
            box-shadow: 0 0 18px rgba(241, 189, 87, 0.16);
            font-size: 1.3rem;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            border-radius: 28px;
            margin-bottom: 18px;
            background: linear-gradient(145deg, rgba(12, 14, 19, 0.94), rgba(3, 4, 5, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.36), inset 0 0 34px rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }

        .score-item {
            min-height: 104px;
            padding: 22px 28px;
            display: flex;
            align-items: center;
            gap: 18px;
            border-right: 1px solid rgba(255, 255, 255, 0.09);
        }

        .score-item:last-child { border-right: 0; }

        .badge {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 226, 154, 0.23), rgba(10, 11, 14, 0.9) 68%);
            border: 1px solid rgba(241, 189, 87, 0.65);
            box-shadow: 0 0 22px rgba(241, 189, 87, 0.18), inset 0 0 14px rgba(255, 226, 154, 0.08);
            font-size: 1.75rem;
        }

        .score-label {
            color: #f7ebd7;
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .score-number {
            color: var(--gold-soft);
            font-family: "Playfair Display", serif;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .combo-text {
            color: var(--gold);
            font-size: 1rem;
            font-weight: 800;
            margin-left: 4px;
        }

        .hearts {
            display: flex;
            gap: 8px;
            font-size: 1.65rem;
            line-height: 1;
            text-shadow: 0 0 13px rgba(255, 83, 104, 0.55);
        }

        .heart { color: var(--red); }
        .heart.lost { color: #383b3f; text-shadow: none; }

        .level-progress {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .progress-track {
            width: 116px;
            height: 12px;
            border-radius: 99px;
            background: #181b20;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ffce55, #fff0ad);
            box-shadow: 0 0 12px rgba(255, 206, 85, 0.8);
            transition: width 0.25s ease;
        }

        .game-shell {
            border-radius: 38px;
            padding: 28px 56px 34px;
            background: linear-gradient(180deg, rgba(9, 12, 15, 0.94), rgba(3, 4, 5, 0.96));
            border: 1px solid rgba(241, 189, 87, 0.62);
            box-shadow:
                0 0 0 1px rgba(255, 226, 154, 0.12),
                0 0 34px rgba(241, 189, 87, 0.24),
                inset 0 0 46px rgba(255, 226, 154, 0.05);
            position: relative;
        }

        .level-ribbon {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 210px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f6e6c5;
            background: linear-gradient(180deg, #080b0e, #0d0f13);
            border: 1px solid rgba(241, 189, 87, 0.7);
            border-top: 0;
            clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%);
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .challenge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 22px;
        }

        .challenge-title {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .mini-mark {
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: #10141a;
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.04);
            font-size: 1.8rem;
        }

        .challenge-title h1 {
            font-family: "Playfair Display", serif;
            color: var(--gold-soft);
            font-size: 2.1rem;
            line-height: 1;
        }

        .challenge-title p {
            color: #f4ecdf;
            font-size: 1.08rem;
            margin-top: 5px;
        }

        .difficulty {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 17px 22px;
            border-radius: 15px;
            border-color: rgba(241, 189, 87, 0.38);
            color: var(--gold-soft);
            background: rgba(9, 11, 14, 0.82);
            box-shadow: inset 0 0 18px rgba(255, 226, 154, 0.05);
            font-weight: 800;
            font-size: 1rem;
        }

        .feedback-line {
            height: 34px;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--gold-soft);
            margin-bottom: 6px;
        }

        .feedback-line.bad { color: var(--red); text-shadow: 0 0 14px rgba(255, 83, 104, 0.42); }
        .feedback-line.good { color: var(--green); text-shadow: 0 0 14px rgba(155, 224, 110, 0.35); }

        .staff-card {
            height: 164px;
            display: flex;
            align-items: center;
            gap: 42px;
            padding: 24px 38px;
            margin-bottom: 22px;
            border-radius: 20px;
            background:
                linear-gradient(rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.02)),
                #111318;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 0 36px rgba(255, 255, 255, 0.05), 0 20px 40px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .clef {
            font-family: "Playfair Display", serif;
            font-size: 6.7rem;
            color: var(--gold-soft);
            line-height: 1;
            text-shadow: 0 0 18px rgba(241, 189, 87, 0.55);
            min-width: 78px;
        }

        .staff-lines {
            flex: 1;
            height: 100px;
            position: relative;
            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0 17px,
                    rgba(245, 229, 202, 0.56) 18px 20px,
                    transparent 21px 22px
                );
        }

        .staff-note {
            position: absolute;
            left: var(--note-left, 46%);
            top: var(--note-top, 48%);
            width: 38px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff4de, #877968 56%, #0d0d0e 100%);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.2);
            transform: rotate(-16deg);
        }

        .staff-note::after {
            content: "";
            position: absolute;
            width: 3px;
            height: 72px;
            background: linear-gradient(#f1e1c8, #7e7367);
            right: -1px;
            bottom: 11px;
            transform: rotate(16deg);
            border-radius: 3px;
        }

        .piano-wrap {
            padding: 11px;
            border-radius: 22px;
            background: #080a0d;
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.04);
            overflow-x: auto;
        }

        .piano {
            --white-w: 102px;
            --white-h: 252px;
            --black-w: 68px;
            --black-h: 132px;
            width: calc(var(--white-w) * 9);
            min-width: calc(var(--white-w) * 9);
            height: var(--white-h);
            display: grid;
            grid-template-columns: repeat(9, var(--white-w));
            position: relative;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
        }

        .white-key,
        .black-key {
            font: inherit;
            cursor: pointer;
            border: 0;
            position: relative;
        }

        .white-key {
            height: var(--white-h);
            background: linear-gradient(180deg, #fff8ed, #ead8bd);
            border-right: 2px solid rgba(36, 24, 12, 0.42);
            box-shadow: inset 0 -12px 18px rgba(117, 75, 35, 0.16);
            transition: transform 0.08s ease, filter 0.08s ease, box-shadow 0.08s ease;
        }

        .white-key:first-child { border-radius: 14px 0 0 14px; }
        .white-key:nth-of-type(9) { border-radius: 0 14px 14px 0; border-right: 0; }
        .white-key.hot { background: linear-gradient(180deg, #fff6ed, #ffd9ca 58%, #f1ddc7); }

        .white-key.active,
        .white-key:active {
            transform: translateY(6px);
            filter: brightness(1.08);
            box-shadow: inset 0 0 22px rgba(241, 189, 87, 0.28);
        }

        .white-key.wrong {
            box-shadow: inset 0 0 32px rgba(255, 83, 104, 0.8), 0 0 24px rgba(255, 83, 104, 0.55);
        }

        .black-key {
            position: absolute;
            top: 0;
            z-index: 3;
            width: var(--black-w);
            height: var(--black-h);
            border-radius: 0 0 9px 9px;
            color: var(--gold-soft);
            background: linear-gradient(180deg, #1d2025, #030405 72%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 6px 0 #000, 0 12px 22px rgba(0, 0, 0, 0.6);
            transition: transform 0.08s ease, filter 0.08s ease, box-shadow 0.08s ease;
        }

        .black-key.active,
        .black-key:active {
            transform: translateY(5px);
            filter: brightness(1.18);
            box-shadow: 0 2px 0 #000, 0 8px 16px rgba(0, 0, 0, 0.55);
        }

        .black-key.wrong {
            border-color: rgba(255, 83, 104, 0.9);
            box-shadow: 0 2px 0 #000, 0 0 22px rgba(255, 83, 104, 0.92), inset 0 0 24px rgba(255, 83, 104, 0.24);
        }

        .key-label {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 28px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: 800;
            color: #080808;
        }

        .black-key .key-label {
            top: 74px;
            bottom: auto;
            color: var(--gold-soft);
            font-size: 1.15rem;
        }

        .key-hint {
            display: block;
            margin-top: 6px;
            font-size: 0.62rem;
            color: rgba(0, 0, 0, 0.45);
            letter-spacing: 0.1em;
        }

        .black-key .key-hint { color: rgba(255, 226, 154, 0.55); }

        .instruction {
            text-align: center;
            color: #f4bd72;
            font-size: 1.03rem;
            margin: 13px 0 18px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            gap: 20px;
        }

        .info-card {
            min-height: 104px;
            border-radius: 17px;
            background: rgba(9, 12, 16, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 22px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .info-icon {
            font-size: 1.85rem;
            color: var(--gold-soft);
            text-shadow: 0 0 12px rgba(241, 189, 87, 0.36);
        }

        .info-card h3 {
            color: var(--gold-soft);
            font-size: 1.05rem;
            margin-bottom: 7px;
        }

        .info-card p {
            color: #eee3d1;
            font-size: 0.93rem;
            line-height: 1.35;
        }

        .streak-dots {
            display: flex;
            gap: 14px;
            margin-top: 14px;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: #13161a;
        }

        .dot.filled {
            background: radial-gradient(circle, #fff1a5 0%, #ffc73e 55%, #b66e18 100%);
            box-shadow: 0 0 13px rgba(255, 199, 62, 0.7);
        }

        .home-screen {
            min-height: 650px;
            display: grid;
            place-items: center;
            text-align: center;
            border-radius: 38px;
            background: linear-gradient(180deg, rgba(9, 12, 15, 0.91), rgba(3, 4, 5, 0.95));
            border: 1px solid rgba(241, 189, 87, 0.48);
            box-shadow: 0 0 34px rgba(241, 189, 87, 0.18);
            padding: 42px;
        }

        .home-logo {
            font-family: "Playfair Display", serif;
            font-size: clamp(3.8rem, 9vw, 7rem);
            color: var(--gold-soft);
            text-shadow: 0 0 28px rgba(241, 189, 87, 0.5);
            margin-bottom: 12px;
        }

        .home-sub {
            color: #f3e6ce;
            font-size: 1.28rem;
            margin-bottom: 34px;
        }

        .primary-btn,
        .ghost-btn {
            border: 1px solid rgba(241, 189, 87, 0.75);
            border-radius: 18px;
            padding: 17px 30px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .primary-btn {
            color: #130d05;
            background: linear-gradient(135deg, #fff0ad, #f1bd57 55%, #b87a2a);
            box-shadow: 0 0 28px rgba(241, 189, 87, 0.24);
        }

        .ghost-btn {
            color: var(--gold-soft);
            background: rgba(6, 8, 11, 0.82);
        }

        .home-actions {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .completion {
            min-height: 520px;
            display: grid;
            place-items: center;
            text-align: center;
        }

        .completion h2 {
            font-family: "Playfair Display", serif;
            color: var(--gold-soft);
            font-size: 3rem;
            margin-bottom: 12px;
        }

        @media (max-width: 1050px) {
            .topbar { grid-template-columns: 1fr; }
            .brand, .top-actions { justify-content: center; }
            .nav { width: 100%; overflow-x: auto; justify-content: flex-start; }
            .scoreboard { grid-template-columns: repeat(2, 1fr); }
            .score-item:nth-child(2) { border-right: 0; }
            .score-item:nth-child(-n + 2) { border-bottom: 1px solid rgba(255, 255, 255, 0.09); }
            .game-shell { padding: 28px 26px 30px; }
            .info-grid { grid-template-columns: 1fr; }
            .piano-wrap { overflow-x: auto; }
            .piano { margin: 0; }
        }

        @media (max-width: 720px) {
            .stage { width: min(100% - 18px, 1180px); margin: 12px auto; }
            .brand-title { font-size: 2rem; }
            .brand-mark { width: 46px; height: 46px; }
            .scoreboard { grid-template-columns: 1fr; }
            .score-item { border-right: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.09); min-height: 88px; }
            .score-item:last-child { border-bottom: 0; }
            .game-shell { border-radius: 26px; padding: 24px 14px 20px; }
            .challenge-header { flex-direction: column; align-items: stretch; margin-top: 22px; }
            .difficulty { justify-content: center; }
            .staff-card { padding: 18px; gap: 16px; height: 132px; }
            .clef { font-size: 5rem; min-width: 50px; }
            .piano {
                --white-w: 74px;
                --white-h: 206px;
                --black-w: 50px;
                --black-h: 112px;
            }
            .key-label { font-size: 1.1rem; }
            .black-key .key-label { font-size: 0.92rem; top: 66px; }
            .nav-btn { padding: 11px 14px; }
        }
    </style>
</head>
<body>
    <div class="music-bg" aria-hidden="true">
        <span>𝄞</span>
        <span>♫</span>
        <span>♪</span>
        <span>♬</span>
    </div>

    <main class="stage" id="appRoot"></main>

    <script>
        let audioCtx = null;
        const MAX_LIVES = 5;
        const POINTS_PER_CORRECT = 250;
        const NOTE_POSITIONS = {
            C4: { left: '20%', top: '68%' },
            D4: { left: '29%', top: '59%' },
            E4: { left: '38%', top: '50%' },
            F4: { left: '47%', top: '41%' },
            G4: { left: '56%', top: '32%' },
            A4: { left: '65%', top: '23%' },
            B4: { left: '74%', top: '14%' },
            C5: { left: '83%', top: '7%' }
        };

        const pianoNotes = [
            { note: 'C4', type: 'white', label: 'C', keyChar: 'a' },
            { note: 'C#4', type: 'black', label: 'C#', keyChar: 'w', after: 1 },
            { note: 'D4', type: 'white', label: 'D', keyChar: 's' },
            { note: 'D#4', type: 'black', label: 'D#', keyChar: 'e', after: 2 },
            { note: 'E4', type: 'white', label: 'E', keyChar: 'd' },
            { note: 'F4', type: 'white', label: 'F', keyChar: 'f' },
            { note: 'F#4', type: 'black', label: 'F#', keyChar: 't', after: 4 },
            { note: 'G4', type: 'white', label: 'G', keyChar: 'g' },
            { note: 'G#4', type: 'black', label: 'G#', keyChar: 'y', after: 5 },
            { note: 'A4', type: 'white', label: 'A', keyChar: 'h' },
            { note: 'A#4', type: 'black', label: 'A#', keyChar: 'u', after: 6, hot: true },
            { note: 'B4', type: 'white', label: 'B', keyChar: 'j' },
            { note: 'C5', type: 'white', label: 'C', keyChar: 'k' },
            { note: 'D5', type: 'white', label: 'D', keyChar: 'l' }
        ];

        const freqMap = {
            C4: 261.63, 'C#4': 277.18, D4: 293.66, 'D#4': 311.13, E4: 329.63,
            F4: 349.23, 'F#4': 369.99, G4: 392, 'G#4': 415.3, A4: 440,
            'A#4': 466.16, B4: 493.88, C5: 523.25, D5: 587.33
        };

        const challenges = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];
        let score = 0;
        let combo = 0;
        let lives = MAX_LIVES;
        let level = 1;
        let challengeIndex = 0;
        let currentNote = challenges[0];
        let isGameActive = false;

        const $ = selector => document.querySelector(selector);
        const root = $('#appRoot');

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playNote(note) {
            if (!freqMap[note]) return;
            const ctx = initAudio();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freqMap[note];
            gain.gain.setValueAtTime(0.34, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(now + 0.72);
        }

        function playTone(freq, type = 'sine') {
            const ctx = initAudio();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.24, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(now + 0.28);
        }

        function label(note) {
            return note.replace('4', '').replace('5', '');
        }

        function renderHome() {
            isGameActive = false;
            root.innerHTML = `
                <section class="home-screen">
                    <div>
                        <div class="brand-mark" style="margin: 0 auto 22px;">▥</div>
                        <div class="home-logo">Pianova</div>
                        <p class="home-sub">Play • Learn • Master</p>
                        <div class="home-actions">
                            <button class="primary-btn" id="startBtn">Start Creative Game</button>
                            <button class="ghost-btn" id="demoBtn">Practice Mode</button>
                        </div>
                    </div>
                </section>
            `;
            $('#startBtn').addEventListener('click', startGame);
            $('#demoBtn').addEventListener('click', startGame);
        }

        function renderTopbar() {
            return `
                <header class="topbar">
                    <div class="brand">
                        <div class="brand-mark">▥</div>
                        <div>
                            <div class="brand-title">Pianova♪</div>
                            <div class="brand-sub">Play • Learn • Master</div>
                        </div>
                    </div>
                    <nav class="nav" aria-label="Game navigation">
                        <button class="nav-btn active">⌂ Home</button>
                        <button class="nav-btn">♫ Practice</button>
                        <button class="nav-btn">▤ Lessons</button>
                        <button class="nav-btn">♕ Leaderboard</button>
                        <button class="nav-btn">♙ Profile</button>
                    </nav>
                    <div class="top-actions">
                        <button class="icon-btn" id="soundBtn" title="Sound">♪</button>
                        <button class="icon-btn" id="resetBtn" title="Restart">⚙</button>
                    </div>
                </header>
            `;
        }

        function renderScoreboard() {
            const progress = Math.round((challengeIndex / challenges.length) * 100);
            return `
                <section class="scoreboard">
                    <div class="score-item">
                        <div class="badge">★</div>
                        <div>
                            <div class="score-label">Score</div>
                            <div class="score-number" id="scoreValue">${score}</div>
                        </div>
                    </div>
                    <div class="score-item">
                        <div class="badge">♨</div>
                        <div>
                            <div class="score-label">Combo</div>
                            <div><span class="score-number" id="comboValue">${combo}</span><span class="combo-text">${combo >= 5 ? 'Perfect!' : 'Keep going!'}</span></div>
                        </div>
                    </div>
                    <div class="score-item">
                        <div class="badge" style="border-color: rgba(255,83,104,.55);">♥</div>
                        <div>
                            <div class="score-label">Lives</div>
                            <div class="hearts" id="livesValue">${renderHearts()}</div>
                        </div>
                    </div>
                    <div class="score-item">
                        <div>
                            <div class="score-label">Level ${level}</div>
                            <div class="level-progress">
                                <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:${progress}%"></div></div>
                                <strong id="progressText">${progress}%</strong>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        function renderHearts() {
            return Array.from({ length: MAX_LIVES }, (_, index) => `<span class="heart${index >= lives ? ' lost' : ''}">${index < lives ? '♥' : '♡'}</span>`).join('');
        }

        function renderPiano() {
            const whiteKeys = pianoNotes
                .filter(note => note.type === 'white')
                .map(note => `
                    <button class="white-key${note.hot ? ' hot' : ''}" data-note="${note.note}" type="button">
                        <span class="key-label">${note.label}<span class="key-hint">${note.keyChar.toUpperCase()}</span></span>
                    </button>
                `)
                .join('');
            const blackKeys = pianoNotes
                .filter(note => note.type === 'black')
                .map(note => `
                    <button class="black-key${note.hot ? ' hot' : ''}" data-note="${note.note}" type="button" style="left: calc((var(--white-w) * ${note.after}) - (var(--black-w) / 2));">
                        <span class="key-label">${note.label}<span class="key-hint">${note.keyChar.toUpperCase()}</span></span>
                    </button>
                `)
                .join('');

            return `<div class="piano-wrap"><div class="piano">${whiteKeys}${blackKeys}</div></div>`;
        }

        function renderGame() {
            const pos = NOTE_POSITIONS[currentNote] || NOTE_POSITIONS.C4;
            root.innerHTML = `
                ${renderTopbar()}
                ${renderScoreboard()}
                <section class="game-shell">
                    <div class="level-ribbon">Level ${level}</div>
                    <div class="challenge-header">
                        <div class="challenge-title">
                            <div class="mini-mark">▥</div>
                            <div>
                                <h1>Pianova</h1>
                                <p>Identify the note</p>
                            </div>
                        </div>
                        <button class="difficulty">♫ Beginner ˅</button>
                    </div>
                    <div class="feedback-line" id="feedbackLine">Click the matching piano key</div>
                    <div class="staff-card">
                        <div class="clef">𝄞</div>
                        <div class="staff-lines">
                            <div class="staff-note" style="--note-left:${pos.left}; --note-top:${pos.top};"></div>
                        </div>
                    </div>
                    ${renderPiano()}
                    <p class="instruction">Click the piano key that matches the staff</p>
                    <div class="info-grid">
                        <article class="info-card">
                            <div class="info-icon">◎</div>
                            <div>
                                <h3>Objective</h3>
                                <p>Identify the correct note on the staff</p>
                            </div>
                        </article>
                        <article class="info-card">
                            <div class="info-icon">★</div>
                            <div style="width: 100%;">
                                <h3>5 Correct in a row!</h3>
                                <div class="streak-dots">${renderDots()}</div>
                            </div>
                        </article>
                        <article class="info-card">
                            <div class="info-icon">♢</div>
                            <div>
                                <h3>Tip</h3>
                                <p>Every line and space has a name!</p>
                            </div>
                        </article>
                    </div>
                </section>
            `;
            attachEvents();
        }

        function renderDots() {
            return Array.from({ length: 8 }, (_, index) => `<span class="dot${index < combo ? ' filled' : ''}"></span>`).join('');
        }

        function attachEvents() {
            document.querySelectorAll('[data-note]').forEach(key => {
                key.addEventListener('click', () => handleGuess(key.dataset.note, key));
            });
            $('#resetBtn')?.addEventListener('click', startGame);
            $('#soundBtn')?.addEventListener('click', () => playTone(880));
        }

        function startGame() {
            score = 0;
            combo = 0;
            lives = MAX_LIVES;
            level = 1;
            challengeIndex = 0;
            currentNote = challenges[0];
            isGameActive = true;
            renderGame();
        }

        function nextChallenge() {
            challengeIndex++;
            if (challengeIndex >= challenges.length) {
                level++;
                challengeIndex = 0;
            }
            currentNote = challenges[challengeIndex];
            if (level > 3) {
                showCompletion(true);
                return;
            }
            renderGame();
        }

        function updateStatsOnly() {
            $('#scoreValue').textContent = score;
            $('#comboValue').textContent = combo;
            $('#livesValue').innerHTML = renderHearts();
            const progress = Math.round((challengeIndex / challenges.length) * 100);
            $('#progressFill').style.width = `${progress}%`;
            $('#progressText').textContent = `${progress}%`;
            document.querySelector('.streak-dots').innerHTML = renderDots();
        }

        function handleGuess(note, keyEl) {
            if (!isGameActive) return;
            playNote(note);
            keyEl.classList.add('active');
            setTimeout(() => keyEl.classList.remove('active'), 150);

            const feedback = $('#feedbackLine');
            if (note === currentNote) {
                score += POINTS_PER_CORRECT;
                combo = Math.min(combo + 1, 8);
                feedback.textContent = `Correct! That was ${label(currentNote)}`;
                feedback.className = 'feedback-line good';
                playTone(1046.5);
                updateStatsOnly();
                setTimeout(nextChallenge, 620);
                return;
            }

            lives--;
            combo = 0;
            feedback.textContent = `Wrong! That was ${label(note)}`;
            feedback.className = 'feedback-line bad';
            keyEl.classList.add('wrong');
            playTone(180, 'sawtooth');
            updateStatsOnly();
            setTimeout(() => keyEl.classList.remove('wrong'), 600);
            if (lives <= 0) {
                setTimeout(() => showCompletion(false), 700);
            }
        }

        function showCompletion(won) {
            isGameActive = false;
            root.innerHTML = `
                ${renderTopbar()}
                ${renderScoreboard()}
                <section class="game-shell completion">
                    <div>
                        <div class="badge" style="margin: 0 auto 22px; width: 86px; height: 86px; font-size: 2.5rem;">${won ? '★' : '♥'}</div>
                        <h2>${won ? 'Maestro!' : 'Try Again'}</h2>
                        <p style="color: var(--muted); margin-bottom: 26px;">Final score: <strong style="color: var(--gold-soft);">${score}</strong></p>
                        <div class="home-actions">
                            <button class="primary-btn" id="playAgainBtn">Play Again</button>
                            <button class="ghost-btn" id="homeBtn">Home</button>
                        </div>
                    </div>
                </section>
            `;
            $('#playAgainBtn').addEventListener('click', startGame);
            $('#homeBtn').addEventListener('click', renderHome);
            $('#resetBtn')?.addEventListener('click', startGame);
        }

        window.addEventListener('keydown', event => {
            if (!isGameActive) return;
            const found = pianoNotes.find(note => note.keyChar === event.key.toLowerCase());
            if (!found) return;
            event.preventDefault();
            const key = document.querySelector(`[data-note="${found.note}"]`);
            handleGuess(found.note, key);
        });

        renderHome();
    </script>
</body>
</html>
