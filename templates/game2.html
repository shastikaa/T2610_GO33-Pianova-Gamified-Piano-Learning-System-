<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pianova Pro</title>
    <style>

        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 10% 10%, #14243c 0%, #070b12 35%, #040608 100%);
            color: white;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            padding: 16px;
        }

        .top-shell {
            width: min(1400px, 100%);
            border: 1px solid rgba(238, 187, 101, 0.32);
            border-radius: 26px;
            background: rgba(8, 13, 21, 0.84);
            box-shadow: 0 16px 36px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
            margin-bottom: 18px;
            overflow: hidden;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
        }

        .brand {
            font-size: 20px;
            color: #f8d59a;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-pill {
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #0c1016;
            color: #f3d8aa;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .nav-pill.active {
            background: linear-gradient(135deg, #7f5d2e, #3a2a1b);
        }

        .top-stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(150px, 1fr));
            gap: 12px;
            padding: 12px 16px 16px;
        }

        .stat-card {
            background: rgba(7,10,16,0.9);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 18px;
            padding: 12px 14px;
        }

        .stat-title {
            color: #f0ddc1;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #ffe4b3;
            line-height: 1;
        }

        .hearts {
            color: #ff6f91;
            letter-spacing: 2px;
            font-size: 22px;
        }

        .level-track {
            height: 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            margin-top: 8px;
            overflow: hidden;
        }

        .level-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd071, #ff9f43);
            transition: width 0.3s ease;
        }

        .level-percent {
            margin-top: 6px;
            color: #f0ddc1;
            font-weight: 700;
        }

        .container {
            text-align: center;
            background: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            width: min(860px, 100%);
            border: 1px solid rgba(238, 187, 101, 0.3);
        }

        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo { margin: 0; font-size: 28px; color: gold; }
        .progress { font-size: 20px; font-weight: bold; }

        #staff {
            background: #eee;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .piano {
            display: flex;
            justify-content: center;
            position: relative;
            height: 200px;
            margin-top: 20px;
            background: #111;
            padding: 10px;
            border-radius: 5px;
        }

        .key {
            width: 50px;
            height: 180px;
            background: white;
            border: 1px solid #999;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            z-index: 1;
            transition: background 0.1s;
        }

        .key.black {
            width: 34px;
            height: 110px;
            background: #222;
            color: white;
            margin-left: -17px;
            margin-right: -17px;
            z-index: 2;
            border: 1px solid #000;
        }

        .key:active { background: #ccc; }
        .key.black:active { background: #444; }

        .hint { color: #aaa; margin-top: 10px; font-style: italic; }

        /* === ADDED: Modal UI === */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background: #2d2d2d;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .modal button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .quit-button {
            padding: 10px 20px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .quit-button:hover {
            background-color: #cc0000;
        }

        @media (max-width: 850px) {
            .top-stats {
                grid-template-columns: repeat(2, minmax(140px, 1fr));
            }
            .stat-value {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<div class="top-shell">
    <div class="top-nav">
        <div class="brand">Pianova - Play - Learn - Master</div>
        <div class="nav-links">
            <a class="nav-pill active" href="#">Home</a>
            <a class="nav-pill" href="#">Practice</a>
            <a class="nav-pill" href="#">Lessons</a>
            <a class="nav-pill" href="#">Leaderboard</a>
            <a class="nav-pill" href="#">Profile</a>
        </div>
    </div>
    <div class="top-stats">
        <div class="stat-card">
            <div class="stat-title">Score</div>
            <div class="stat-value" id="score-top">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Combo</div>
            <div class="stat-value" id="combo-top">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Lives</div>
            <div class="hearts" id="lives-top">♥ ♥ ♥ ♥ ♥</div>
        </div>
        <div class="stat-card">
            <div class="stat-title" id="level-title">Level 1</div>
            <div class="level-track"><div class="level-fill" id="level-fill"></div></div>
            <div class="level-percent" id="level-percent">0%</div>
        </div>
    </div>
</div>

<div class="container" id="game-container">
    <div class="header">
        <h1 class="logo">🎹 Pianova</h1>
        <!-- UPDATED (added lives) -->
        <div class="progress">
            Score: <span id="score">0</span> | Lives: <span id="lives">5</span>
            <button class="quit-button" onclick="quitGame()">Quit</button>
        </div>
    </div>

    <h2 id="instruction">Identify the note on the staff</h2>
    <canvas id="staff" width="600" height="180"></canvas>

    <div class="piano" id="piano"></div>
    <p class="hint">Click the piano key that matches the staff!</p>
</div>

<!-- === ADDED: Modal === -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="modal-text"></h2>
        <button onclick="restartGame()">Restart</button>
        <button onclick="goHome()">Home</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const frequencies = {
        "C": 261.63, "C#": 277.18, "D": 293.66, "D#": 311.13,
        "E": 329.63, "F": 349.23, "F#": 369.99, "G": 392.00,
        "G#": 415.30, "A": 440.00, "A#": 466.16, "B": 493.88, "C2": 523.25
    };

    function playNote(note) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(frequencies[note], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1);
    }

    const pianoLayout = [
        { note: "C", color: "white" }, { note: "C#", color: "black" },
        { note: "D", color: "white" }, { note: "D#", color: "black" },
        { note: "E", color: "white" }, { note: "F", color: "white" },
        { note: "F#", color: "black" }, { note: "G", color: "white" },
        { note: "G#", color: "black" }, { note: "A", color: "white" },
        { note: "A#", color: "black" }, { note: "B", color: "white" },
        { note: "C2", color: "white", label: "C" }
    ];

    const staffPos = {
    "C": 138,   // Ledger line below
    "C#": 138,  // C with Sharp sign
    "D": 130,   // Below the first line
    "D#": 130,  // D with Sharp sign
    "E": 122,   // On the first line
    "F": 114,   // First space
    "F#": 114,  // F with Sharp sign
    "G": 106,   // Second line
    "G#": 106,  // G with Sharp sign
    "A": 98,    // Second space
    "A#": 98,   // A with Sharp sign
    "B": 90,    // Third line
    "C2": 82    // Third space
};

    let currentNote = "";
    let score = 0;
    let combo = 0;

    // === ADDED ===
    let lives = 5;
    const maxScore = 10;

    function renderHearts(count) {
        return new Array(Math.max(0, count)).fill("♥").join(" ");
    }

    function updateTopStats() {
        const scoreTop = document.getElementById("score-top");
        const comboTop = document.getElementById("combo-top");
        const livesTop = document.getElementById("lives-top");
        const levelFill = document.getElementById("level-fill");
        const levelPercent = document.getElementById("level-percent");
        if (scoreTop) scoreTop.innerText = score;
        if (comboTop) comboTop.innerText = combo;
        if (livesTop) livesTop.innerText = renderHearts(lives);

        const percent = Math.min(100, Math.round((score / maxScore) * 100));
        if (levelFill) levelFill.style.width = `${percent}%`;
        if (levelPercent) levelPercent.innerText = `${percent}%`;
    }

    function drawStaff(note) {
        const canvas = document.getElementById("staff");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            let y = 60 + i * 16;
            ctx.beginPath();
            ctx.moveTo(50, y);
            ctx.lineTo(550, y);
            ctx.stroke();
        }

        ctx.font = "70px serif";
        ctx.fillStyle = "#333";
        ctx.fillText("𝄞", 60, 130);

        const y = staffPos[note];

        if (note.includes("#")) {
            ctx.font = "24px serif";
            ctx.fillText("♯", 270, y + 8);
        }

        if (note === "C" || note === "C#") {
            ctx.beginPath();
            ctx.moveTo(280, 138);
            ctx.lineTo(320, 138);
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.ellipse(300, y, 9, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(308, y);
        ctx.lineTo(308, y - 45);
        ctx.stroke();
    }

    function handleInput(note) {
        playNote(note);

        if (note === currentNote) {
            score++;
            combo++;
            document.getElementById("score").innerText = score;
            updateTopStats();

            // WIN
            if (score >= maxScore) {
                saveGameResult(score, true);
                showModal("🎉 You Passed!");
                return;
            }

            document.getElementById("instruction").innerText = "Excellent! Next one...";
            document.getElementById("instruction").style.color = "gold";
            setTimeout(newQuestion, 500);

        } else {
            lives--;
            combo = 0;
            document.getElementById("lives").innerText = lives;
            updateTopStats();

            if (lives <= 0) {
                saveGameResult(score, false);
                showModal("❌ You Failed!");
                return;
            }

            document.getElementById("game-container").classList.add("shake");
            document.getElementById("instruction").innerText = `Wrong! That was ${currentNote}`;
            document.getElementById("instruction").style.color = "#ff4444";

            setTimeout(() => {
                document.getElementById("game-container").classList.remove("shake");
                newQuestion();
            }, 1000);
        }
    }

    function saveGameResult(finalScore, passed) {
        fetch('/api/save-game2', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ score: finalScore, passed: passed })
        }).catch(console.error);
    }

    function showModal(text) {
        document.getElementById("modal-text").innerText = text;
        document.getElementById("modal").style.display = "flex";
    }

    function restartGame() {
        score = 0;
        combo = 0;
        lives = 5;
        document.getElementById("score").innerText = score;
        document.getElementById("lives").innerText = lives;
        document.getElementById("modal").style.display = "none";
        updateTopStats();
        newQuestion();
    }

    function goHome() {
        location.reload();
    }

    function quitGame() {
        if (confirm('Are you sure you want to quit? Your progress will not be saved.')) {
            window.location.href = '/';
        }
    }

    function newQuestion() {
        const keys = Object.keys(staffPos);
        currentNote = keys[Math.floor(Math.random() * keys.length)];
        drawStaff(currentNote);
    }

    function init() {
        const piano = document.getElementById("piano");
        pianoLayout.forEach(item => {
            const div = document.createElement("div");
            div.className = `key ${item.color}`;
            div.innerHTML = `<span>${item.label || item.note}</span>`;
            div.onclick = () => handleInput(item.note);
            piano.appendChild(div);
        });
        updateTopStats();
        newQuestion();
    }

    window.onload = init;

    const practiceSessionStartedAt = Date.now();
    let practiceSessionSent = false;

    function sendPracticeSession() {
        if (practiceSessionSent) return;
        practiceSessionSent = true;
        const durationSeconds = Math.max(1, Math.round((Date.now() - practiceSessionStartedAt) / 1000));
        const payload = JSON.stringify({ game_type: 'game2', duration_seconds: durationSeconds });
        if (navigator.sendBeacon) {
            navigator.sendBeacon('/api/log-practice-session', new Blob([payload], { type: 'application/json' }));
            return;
        }
        fetch('/api/log-practice-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true,
        }).catch(() => {});
    }

    window.addEventListener('pagehide', sendPracticeSession);
    window.addEventListener('beforeunload', sendPracticeSession);
</script>
</body>
</html>
