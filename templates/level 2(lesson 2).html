<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pianova | Gamified Piano Mastery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020303;
            --panel: rgba(7, 9, 12, 0.92);
            --panel-soft: rgba(13, 15, 20, 0.84);
            --gold: #f2bd57;
            --gold-soft: #ffe3a1;
            --gold-deep: #9a6425;
            --cream: #fff3df;
            --muted: #d6c5a8;
            --red: #ff5368;
            --green: #a8ea7c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Inter, sans-serif;
            color: var(--cream);
            background:
                radial-gradient(circle at 7% 38%, rgba(242, 189, 87, 0.18), transparent 27%),
                radial-gradient(circle at 96% 45%, rgba(242, 189, 87, 0.22), transparent 26%),
                radial-gradient(circle at 50% 105%, rgba(118, 65, 23, 0.42), transparent 32%),
                #020303;
            padding: 26px 16px;
        }

        .music-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            color: rgba(242, 189, 87, 0.28);
            z-index: 0;
        }

        .music-bg span {
            position: absolute;
            font-family: "Playfair Display", serif;
            font-size: clamp(2rem, 6vw, 6rem);
            filter: drop-shadow(0 0 18px rgba(242, 189, 87, 0.5));
            animation: floatNote 8s ease-in-out infinite;
        }

        .music-bg span:nth-child(1) { left: 2%; top: 35%; animation-delay: 0s; }
        .music-bg span:nth-child(2) { right: 2%; top: 28%; animation-delay: 1.4s; }
        .music-bg span:nth-child(3) { left: 4%; bottom: 12%; font-size: 2.4rem; animation-delay: 2.8s; }
        .music-bg span:nth-child(4) { right: 5%; bottom: 16%; font-size: 3.2rem; animation-delay: 3.6s; }

        @keyframes floatNote {
            0%, 100% { transform: translateY(0); opacity: 0.22; }
            50% { transform: translateY(-18px); opacity: 0.55; }
        }

        .stage {
            width: min(1180px, 100%);
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .topbar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 28px;
            align-items: center;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-mark,
        .mini-mark {
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #13171d, #040506);
            border: 1px solid rgba(242, 189, 87, 0.45);
            box-shadow: 0 0 24px rgba(242, 189, 87, 0.22), inset 0 0 20px rgba(255, 227, 161, 0.06);
            color: var(--cream);
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            font-size: 1.75rem;
        }

        .brand-title {
            font-family: "Playfair Display", serif;
            font-size: clamp(2rem, 4vw, 2.65rem);
            line-height: 0.95;
            color: var(--gold-soft);
            text-shadow: 0 0 20px rgba(242, 189, 87, 0.42);
        }

        .brand-sub {
            color: var(--muted);
            margin-top: 4px;
            font-size: 0.98rem;
            letter-spacing: 0.02em;
        }

        .nav {
            justify-self: center;
            display: flex;
            gap: 12px;
            padding: 8px;
            border-radius: 18px;
            background: rgba(5, 7, 10, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.02);
        }

        .nav-btn,
        .icon-btn,
        .difficulty,
        .home-btn,
        .btn-premium {
            font: inherit;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 13px 18px;
            border-radius: 15px;
            color: #eee8dc;
            background: transparent;
            font-weight: 700;
            white-space: nowrap;
        }

        .nav-btn.active {
            color: var(--gold-soft);
            background: linear-gradient(145deg, rgba(242, 189, 87, 0.18), rgba(255, 255, 255, 0.03));
            box-shadow: inset 0 0 18px rgba(242, 189, 87, 0.08);
        }

        .top-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .icon-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: var(--gold-soft);
            background: rgba(5, 6, 8, 0.68);
            border-color: rgba(242, 189, 87, 0.65);
            box-shadow: 0 0 18px rgba(242, 189, 87, 0.18);
            font-size: 1.25rem;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin-bottom: 18px;
            border-radius: 28px;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(12, 14, 19, 0.96), rgba(3, 4, 5, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.36), inset 0 0 34px rgba(255, 255, 255, 0.03);
        }

        .score-item {
            min-height: 98px;
            padding: 20px 28px;
            display: flex;
            align-items: center;
            gap: 17px;
            border-right: 1px solid rgba(255, 255, 255, 0.09);
        }

        .score-item:last-child { border-right: 0; }

        .badge {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 227, 161, 0.23), rgba(10, 11, 14, 0.92) 68%);
            border: 1px solid rgba(242, 189, 87, 0.68);
            box-shadow: 0 0 22px rgba(242, 189, 87, 0.18), inset 0 0 14px rgba(255, 227, 161, 0.08);
            font-size: 1.7rem;
        }

        .score-label {
            color: #f7ebd8;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .score-number {
            color: var(--gold-soft);
            font-family: "Playfair Display", serif;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .combo-text {
            color: var(--gold);
            font-size: 1rem;
            font-weight: 800;
            margin-left: 4px;
        }

        .lives-row {
            display: flex;
            gap: 8px;
            font-size: 1.55rem;
            line-height: 1;
            text-shadow: 0 0 13px rgba(255, 83, 104, 0.55);
        }

        .heart { color: var(--red); }

        .heart.lost {
            color: #383b3f;
            opacity: 0.86;
            filter: grayscale(1);
            text-shadow: none;
        }

        .level-progress {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .progress-track {
            width: 118px;
            height: 12px;
            overflow: hidden;
            border-radius: 999px;
            background: #191c21;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ffca4d, #fff0ad);
            box-shadow: 0 0 14px rgba(255, 202, 77, 0.8);
            transition: width 0.3s ease;
        }

        .game-shell {
            position: relative;
            padding: 34px 58px 34px;
            border-radius: 38px;
            background: linear-gradient(180deg, rgba(9, 12, 15, 0.95), rgba(3, 4, 5, 0.96));
            border: 1px solid rgba(242, 189, 87, 0.62);
            box-shadow:
                0 0 0 1px rgba(255, 227, 161, 0.11),
                0 0 35px rgba(242, 189, 87, 0.25),
                inset 0 0 46px rgba(255, 227, 161, 0.05);
        }

        .level-ribbon {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 220px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #f7e7c7;
            background: linear-gradient(180deg, #080b0e, #0d0f13);
            border: 1px solid rgba(242, 189, 87, 0.72);
            border-top: 0;
            clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%);
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .challenge-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .challenge-title {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .mini-mark {
            width: 58px;
            height: 58px;
            border-radius: 15px;
            font-size: 1.85rem;
        }

        .challenge-title h1 {
            font-family: "Playfair Display", serif;
            color: var(--gold-soft);
            font-size: 2.15rem;
            line-height: 1;
            text-shadow: 0 0 18px rgba(242, 189, 87, 0.34);
        }

        .challenge-title p {
            color: #f3ebdf;
            margin-top: 6px;
            font-size: 1.03rem;
        }

        .difficulty {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 17px 22px;
            border-radius: 15px;
            color: var(--gold-soft);
            background: rgba(9, 11, 14, 0.84);
            border-color: rgba(242, 189, 87, 0.38);
            box-shadow: inset 0 0 18px rgba(255, 227, 161, 0.05);
            font-weight: 800;
            font-size: 1rem;
        }

        .melody-panel {
            border-radius: 20px;
            padding: 22px 28px;
            margin-bottom: 20px;
            background:
                linear-gradient(rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.02)),
                #111318;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 0 36px rgba(255, 255, 255, 0.05), 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .melody-title {
            text-align: center;
            color: var(--gold-soft);
            font-weight: 800;
            letter-spacing: 0.12em;
            font-size: 0.86rem;
            margin-bottom: 16px;
        }

        .target-notes {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .note-card {
            width: 82px;
            min-height: 70px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: linear-gradient(180deg, #11151b, #080a0d);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--gold-soft);
            font-size: 1.65rem;
            font-weight: 800;
            box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.03);
            transition: 0.2s ease;
        }

        .note-card.active {
            color: #120c04;
            background: linear-gradient(135deg, #fff0ad, #f2bd57 55%, #b87a2a);
            box-shadow: 0 0 18px rgba(242, 189, 87, 0.42), inset 0 0 12px rgba(255, 255, 255, 0.22);
            transform: translateY(-2px);
        }

        .piano-premium {
            padding: 11px;
            margin-bottom: 12px;
            border-radius: 22px;
            background: #080a0d;
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.04);
            overflow-x: auto;
        }

        .piano-container {
            display: flex;
            justify-content: center;
            min-width: max-content;
        }

        .piano-keys {
            --white-key-width: 102px;
            --white-key-height: 246px;
            --black-key-width: 68px;
            --black-key-height: 132px;
            position: relative;
            width: calc(var(--white-key-width) * 9);
            min-width: calc(var(--white-key-width) * 9);
            height: var(--white-key-height);
            display: grid;
            grid-template-columns: repeat(9, var(--white-key-width));
            overflow: hidden;
            border-radius: 16px;
            background: #fff6e7;
        }

        .white-key,
        .black-key {
            font: inherit;
            border: 0;
            cursor: pointer;
            position: relative;
        }

        .white-key {
            z-index: 1;
            height: var(--white-key-height);
            background: linear-gradient(180deg, #fff8ed, #ead8bd);
            border-right: 2px solid rgba(36, 24, 12, 0.42);
            box-shadow: inset 0 -12px 18px rgba(117, 75, 35, 0.16);
            transition: transform 0.08s ease, filter 0.08s ease, box-shadow 0.08s ease;
        }

        .white-key:first-child { border-radius: 14px 0 0 14px; }
        .white-key:nth-of-type(9) { border-radius: 0 14px 14px 0; border-right: 0; }

        .white-key.feature-key {
            background: linear-gradient(180deg, #fff7ed, #ffe5c9 60%, #ead8bd);
        }

        .white-key:active,
        .white-key.active-premium {
            transform: translateY(6px);
            filter: brightness(1.08);
            box-shadow: inset 0 0 24px rgba(242, 189, 87, 0.3);
        }

        .black-key {
            position: absolute;
            top: 0;
            z-index: 3;
            width: var(--black-key-width);
            height: var(--black-key-height);
            border-radius: 0 0 9px 9px;
            color: var(--gold-soft);
            background: linear-gradient(180deg, #1d2025, #030405 72%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 6px 0 #000, 0 12px 22px rgba(0, 0, 0, 0.6);
            transition: transform 0.08s ease, filter 0.08s ease, box-shadow 0.08s ease;
        }

        .black-key:active,
        .black-key.active-premium {
            transform: translateY(5px);
            filter: brightness(1.18);
            box-shadow: 0 2px 0 #000, 0 8px 16px rgba(0, 0, 0, 0.55);
        }

        .key-label {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 26px;
            text-align: center;
            font-size: 1.42rem;
            font-weight: 800;
            color: #080808;
            pointer-events: none;
        }

        .black-key .key-label {
            display: block;
            top: 74px;
            bottom: auto;
            color: var(--gold-soft);
            font-size: 1.12rem;
        }

        .key-hotkey {
            display: block;
            margin-top: 6px;
            font-size: 0.62rem;
            color: rgba(0, 0, 0, 0.45);
            letter-spacing: 0.1em;
        }

        .black-key .key-hotkey { color: rgba(255, 227, 161, 0.55); }

        .instruction {
            text-align: center;
            color: #f4bd72;
            font-size: 1.02rem;
            margin: 10px 0 18px;
        }

        .input-preview {
            border-radius: 17px;
            background: rgba(9, 12, 16, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 20px;
            margin-bottom: 18px;
        }

        .preview-header {
            text-align: center;
            color: var(--gold-soft);
            font-weight: 800;
            font-size: 0.95rem;
            margin-bottom: 14px;
        }

        .preview-bubbles {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .bubble {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #13161a;
            color: var(--muted);
            font-weight: 800;
        }

        .bubble.filled {
            color: #120c04;
            background: radial-gradient(circle, #fff1a5 0%, #ffc73e 55%, #b66e18 100%);
            box-shadow: 0 0 13px rgba(255, 199, 62, 0.7);
        }

        .premium-actions {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin: 18px 0 0;
        }

        .btn-premium,
        .home-btn {
            border-radius: 17px;
            padding: 14px 26px;
            font-weight: 800;
            color: var(--gold-soft);
            background: rgba(6, 8, 11, 0.82);
            border-color: rgba(242, 189, 87, 0.62);
            box-shadow: inset 0 0 16px rgba(255, 227, 161, 0.04);
        }

        .btn-gold,
        .home-btn-primary {
            color: #130d05;
            background: linear-gradient(135deg, #fff0ad, #f2bd57 55%, #b87a2a);
            border-color: rgba(255, 227, 161, 0.8);
            box-shadow: 0 0 24px rgba(242, 189, 87, 0.24);
        }

        .feedback {
            min-height: 48px;
            display: grid;
            place-items: center;
            margin-top: 18px;
            border-radius: 17px;
            background: rgba(9, 12, 16, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--gold-soft);
            font-weight: 800;
            text-align: center;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .info-card {
            min-height: 104px;
            border-radius: 17px;
            background: rgba(9, 12, 16, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 22px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .info-icon {
            font-size: 1.8rem;
            color: var(--gold-soft);
            text-shadow: 0 0 12px rgba(242, 189, 87, 0.38);
        }

        .info-card h3 {
            color: var(--gold-soft);
            font-size: 1.05rem;
            margin-bottom: 7px;
        }

        .info-card p {
            color: #eee3d1;
            font-size: 0.93rem;
            line-height: 1.35;
        }

        .streak-dots {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }

        .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: #13161a;
        }

        .dot.filled {
            background: radial-gradient(circle, #fff1a5 0%, #ffc73e 55%, #b66e18 100%);
            box-shadow: 0 0 13px rgba(255, 199, 62, 0.7);
        }

        .homepage-container,
        .completion-premium {
            min-height: 650px;
            display: grid;
            place-items: center;
            text-align: center;
            border-radius: 38px;
            background: linear-gradient(180deg, rgba(9, 12, 15, 0.91), rgba(3, 4, 5, 0.95));
            border: 1px solid rgba(242, 189, 87, 0.48);
            box-shadow: 0 0 34px rgba(242, 189, 87, 0.18);
            padding: 42px;
        }

        .homepage-logo {
            font-family: "Playfair Display", serif;
            font-size: clamp(3.8rem, 9vw, 7rem);
            color: var(--gold-soft);
            text-shadow: 0 0 28px rgba(242, 189, 87, 0.5);
            margin-bottom: 12px;
        }

        .homepage-sub {
            color: #f3e6ce;
            font-size: 1.25rem;
            margin-bottom: 34px;
        }

        .home-buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            animation: particleFade 0.6s ease-out forwards;
            z-index: 1000;
        }

        @keyframes particleFade {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes pointsPop {
            0% { transform: scale(1); text-shadow: 0 0 0 #ffd966; }
            50% { transform: scale(1.14); text-shadow: 0 0 15px #ffdf80; }
            100% { transform: scale(1); text-shadow: 0 0 5px #ffd966; }
        }

        .points-animation { animation: pointsPop 0.4s ease-in-out; }

        @media (max-width: 1050px) {
            .topbar { grid-template-columns: 1fr; }
            .brand, .top-actions { justify-content: center; }
            .nav {
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
            }
            .scoreboard { grid-template-columns: repeat(2, 1fr); }
            .score-item:nth-child(2) { border-right: 0; }
            .score-item:nth-child(-n + 2) { border-bottom: 1px solid rgba(255, 255, 255, 0.09); }
            .game-shell { padding: 34px 28px 30px; }
            .info-grid { grid-template-columns: 1fr; }
            .piano-container { justify-content: flex-start; }
        }

        @media (max-width: 760px) {
            body { padding: 12px 9px; }
            .brand-title { font-size: 2rem; }
            .brand-mark,
            .icon-btn {
                width: 46px;
                height: 46px;
            }
            .scoreboard { grid-template-columns: 1fr; }
            .score-item {
                min-height: 86px;
                border-right: 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.09);
                padding: 16px 20px;
            }
            .score-item:last-child { border-bottom: 0; }
            .game-shell {
                border-radius: 26px;
                padding: 28px 14px 22px;
            }
            .challenge-header {
                flex-direction: column;
                align-items: stretch;
                margin-top: 20px;
            }
            .difficulty { justify-content: center; }
            .note-card {
                width: 62px;
                min-height: 56px;
                font-size: 1.2rem;
            }
            .piano-keys {
                --white-key-width: 74px;
                --white-key-height: 205px;
                --black-key-width: 50px;
                --black-key-height: 112px;
            }
            .key-label {
                bottom: 20px;
                font-size: 1.08rem;
            }
            .black-key .key-label {
                top: 62px;
                font-size: 0.92rem;
            }
            .homepage-container,
            .completion-premium {
                min-height: 560px;
                padding: 30px 18px;
            }
        }

        @media (min-width: 900px) and (max-height: 820px) {
            body { padding-top: 8px; }
            .topbar { margin-bottom: 16px; }
            .brand-mark,
            .icon-btn {
                width: 48px;
                height: 48px;
            }
            .brand-title { font-size: 2.15rem; }
            .brand-sub { font-size: 0.9rem; }
            .nav-btn { padding: 10px 15px; }
            .scoreboard { margin-bottom: 14px; }
            .score-item {
                min-height: 78px;
                padding: 14px 24px;
            }
            .badge {
                width: 50px;
                height: 50px;
                font-size: 1.45rem;
            }
            .score-number { font-size: 1.72rem; }
            .game-shell { padding: 25px 56px 24px; }
            .challenge-header { margin-bottom: 12px; }
            .mini-mark {
                width: 50px;
                height: 50px;
            }
            .challenge-title h1 { font-size: 1.75rem; }
            .difficulty { padding: 13px 18px; }
            .melody-panel {
                padding: 16px 24px;
                margin-bottom: 14px;
            }
            .note-card {
                width: 68px;
                min-height: 56px;
                font-size: 1.25rem;
            }
            .piano-keys {
                --white-key-width: 96px;
                --white-key-height: 190px;
                --black-key-width: 62px;
                --black-key-height: 112px;
            }
            .key-label {
                bottom: 20px;
                font-size: 1.18rem;
            }
            .black-key .key-label {
                top: 60px;
                font-size: 0.98rem;
            }
            .input-preview { padding: 14px 18px; }
            .bubble {
                width: 40px;
                height: 40px;
            }
            .info-card {
                min-height: 82px;
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="music-bg" aria-hidden="true">
        <span>𝄞</span>
        <span>♫</span>
        <span>♪</span>
        <span>♬</span>
    </div>
    <main class="stage" id="appRoot"></main>

    <script>
        let audioCtx = null;
        const freqMap = { 'C4':261.63, 'C#4':277.18, 'D4':293.66, 'D#4':311.13, 'E4':329.63, 'F4':349.23, 'F#4':369.99, 'G4':392.00, 'G#4':415.30, 'A4':440.00, 'A#4':466.16, 'B4':493.88, 'C5':523.25, 'D5':587.33 };

        const POINTS_PER_LESSON = 250;
        const MAX_LIVES = 5;
        let totalPoints = 0;
        let lives = MAX_LIVES;

        const lessons = [
            { level: 1, sequence: ['C4', 'D4', 'E4'], display: "C - D - E" },
            { level: 2, sequence: ['C4', 'E4', 'G4', 'C5'], display: "C - E - G - C (Majestic)" },
            { level: 3, sequence: ['F4', 'A4', 'C5', 'A4', 'F4'], display: "F - A - C - A - F" },
            { level: 4, sequence: ['E4', 'G4', 'B4', 'C5', 'B4', 'G4'], display: "E - G - B - C - B - G" },
            { level: 5, sequence: ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'], display: "C Major Scale" }
        ];

        const pianoNotes = [
            { note: 'C4', type: 'white', keyChar: 'a', label: 'C' },
            { note: 'C#4', type: 'black', keyChar: 'w', label: 'C#', afterWhite: 1 },
            { note: 'D4', type: 'white', keyChar: 's', label: 'D' },
            { note: 'D#4', type: 'black', keyChar: 'e', label: 'D#', afterWhite: 2 },
            { note: 'E4', type: 'white', keyChar: 'd', label: 'E' },
            { note: 'F4', type: 'white', keyChar: 'f', label: 'F' },
            { note: 'F#4', type: 'black', keyChar: 't', label: 'F#', afterWhite: 4 },
            { note: 'G4', type: 'white', keyChar: 'g', label: 'G' },
            { note: 'G#4', type: 'black', keyChar: 'y', label: 'G#', afterWhite: 5 },
            { note: 'A4', type: 'white', keyChar: 'h', label: 'A' },
            { note: 'A#4', type: 'black', keyChar: 'u', label: 'A#', afterWhite: 6 },
            { note: 'B4', type: 'white', keyChar: 'j', label: 'B' },
            { note: 'C5', type: 'white', keyChar: 'k', label: 'C' },
            { note: 'D5', type: 'white', keyChar: 'l', label: 'D' }
        ];

        let currentLvl = 0;
        let streak = 0;
        let userInput = [];
        let gameCompleted = false;
        let levelSpan, streakSpan, targetContainer, previewContainer, feedbackDiv, progressFill, progressPercentSpan;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playNote(note) {
            if (!freqMap[note]) return;
            const ctx = initAudio();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freqMap[note];
            gain.gain.setValueAtTime(0.34, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.78);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(now + 0.78);
        }

        function playTone(freq, type = 'sine') {
            const ctx = initAudio();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.24, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(now + 0.28);
        }

        function playSuccessSound() { playTone(880); }
        function playErrorSound() { playTone(180, 'sawtooth'); }
        function playPointsChime() { playTone(1046.5); }

        function noteLabel(note) {
            return note.replace('4', '').replace('5', '');
        }

        function addPoints(points, showAnimation = true) {
            totalPoints += points;
            updatePointsDisplay(showAnimation);
            if (showAnimation && points > 0) playPointsChime();
        }

        function updatePointsDisplay(animate = false) {
            const pointsSpan = document.getElementById('pointsDigit');
            if (!pointsSpan) return;
            pointsSpan.innerText = totalPoints;
            if (animate) {
                pointsSpan.classList.add('points-animation');
                setTimeout(() => pointsSpan.classList.remove('points-animation'), 400);
            }
        }

        function updateLivesDisplay() {
            const livesContainer = document.getElementById('livesDisplay');
            if (!livesContainer) return;
            livesContainer.innerHTML = '';
            for (let i = 0; i < MAX_LIVES; i++) {
                const heart = document.createElement('span');
                heart.className = `heart${i >= lives ? ' lost' : ''}`;
                heart.textContent = i < lives ? '♥' : '♡';
                livesContainer.appendChild(heart);
            }
        }

        function loseLife() {
            lives = Math.max(0, lives - 1);
            updateLivesDisplay();
            return lives;
        }

        function createParticles(x, y, isSuccess = true) {
            const particleCount = isSuccess ? 14 : 8;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 7 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x + (Math.random() - 0.5) * 60}px`;
                particle.style.top = `${y + (Math.random() - 0.5) * 60}px`;
                particle.style.background = isSuccess ? 'radial-gradient(circle, #ffe59b, #f2bd57)' : 'radial-gradient(circle, #ff8a98, #ff5368)';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        }

        function renderTopbar() {
            return `
                <header class="topbar">
                    <div class="brand">
                        <div class="brand-mark">▥</div>
                        <div>
                            <div class="brand-title">Pianova♪</div>
                            <div class="brand-sub">Play • Learn • Master</div>
                        </div>
                    </div>
                    <nav class="nav" aria-label="Game navigation">
                        <button class="nav-btn active">⌂ Home</button>
                        <button class="nav-btn">♫ Practice</button>
                        <button class="nav-btn">▤ Lessons</button>
                        <button class="nav-btn">♕ Leaderboard</button>
                        <button class="nav-btn">♙ Profile</button>
                    </nav>
                    <div class="top-actions">
                        <button class="icon-btn" id="soundBtn" title="Sound">♪</button>
                        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
                    </div>
                </header>
            `;
        }

        function renderScoreboard() {
            const progress = lessons[currentLvl] ? Math.round((userInput.length / lessons[currentLvl].sequence.length) * 100) : 100;
            return `
                <section class="scoreboard">
                    <div class="score-item">
                        <div class="badge">★</div>
                        <div>
                            <div class="score-label">Score</div>
                            <div class="score-number" id="pointsDigit">${totalPoints}</div>
                        </div>
                    </div>
                    <div class="score-item">
                        <div class="badge">♨</div>
                        <div>
                            <div class="score-label">Combo</div>
                            <div><span class="score-number" id="streakDigit">${streak}</span><span class="combo-text">${streak >= 3 ? 'Perfect!' : 'Keep going!'}</span></div>
                        </div>
                    </div>
                    <div class="score-item">
                        <div class="badge" style="border-color: rgba(255,83,104,.55);">♥</div>
                        <div>
                            <div class="score-label">Lives</div>
                            <div class="lives-row" id="livesDisplay"></div>
                        </div>
                    </div>
                    <div class="score-item">
                        <div>
                            <div class="score-label">Level <span id="levelDigit">${lessons[currentLvl].level}</span></div>
                            <div class="level-progress">
                                <div class="progress-track"><div class="progress-fill" id="progressBarFill" style="width:${progress}%"></div></div>
                                <strong id="progressPercent">${progress}%</strong>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        function buildCleanPiano() {
            const whiteKeysHtml = pianoNotes
                .filter(key => key.type === 'white')
                .map(key => `
                    <button class="white-key${key.feature ? ' feature-key' : ''}" data-note="${key.note}" type="button">
                        <span class="key-label">${key.label}<span class="key-hotkey">${key.keyChar.toUpperCase()}</span></span>
                    </button>
                `)
                .join('');

            const blackKeysHtml = pianoNotes
                .filter(key => key.type === 'black')
                .map(key => `
                    <button class="black-key" data-note="${key.note}" type="button" style="left: calc((var(--white-key-width) * ${key.afterWhite}) - (var(--black-key-width) / 2));">
                        <span class="key-label">${key.label}<span class="key-hotkey">${key.keyChar.toUpperCase()}</span></span>
                    </button>
                `)
                .join('');

            return `<div class="piano-container"><div class="piano-keys">${whiteKeysHtml}${blackKeysHtml}</div></div>`;
        }

        function attachPianoEvents() {
            document.querySelectorAll('.white-key, .black-key').forEach(el => {
                const note = el.getAttribute('data-note');
                if (note) {
                    el.removeEventListener('click', pianoClickHandler);
                    el.addEventListener('click', pianoClickHandler);
                }
            });
        }

        function pianoClickHandler() {
            const note = this.getAttribute('data-note');
            const rect = this.getBoundingClientRect();
            createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, true);
            processNoteInput(note);
        }

        function animateKeyVisual(note) {
            const el = document.querySelector(`.white-key[data-note="${note}"], .black-key[data-note="${note}"]`);
            if (!el) return;
            el.classList.add('active-premium');
            setTimeout(() => el.classList.remove('active-premium'), 150);
        }

        function updateProgressBar() {
            if (!progressFill) return;
            const currentSeq = lessons[currentLvl].sequence;
            const progressPercent = (userInput.length / currentSeq.length) * 100;
            progressFill.style.width = `${progressPercent}%`;
            if (progressPercentSpan) progressPercentSpan.innerText = `${Math.round(progressPercent)}%`;
        }

        function renderTargets() {
            if (gameCompleted) return;
            const seq = lessons[currentLvl].sequence;
            targetContainer.innerHTML = '';
            seq.forEach((n, idx) => {
                const card = document.createElement('div');
                card.className = 'note-card';
                if (idx === userInput.length) card.classList.add('active');
                card.innerText = noteLabel(n);
                targetContainer.appendChild(card);
            });
        }

        function updatePreview() {
            const seq = lessons[currentLvl].sequence;
            previewContainer.innerHTML = '';
            for (let i = 0; i < seq.length; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                if (userInput[i]) {
                    bubble.classList.add('filled');
                    bubble.innerText = noteLabel(userInput[i]);
                } else {
                    bubble.innerText = '';
                }
                previewContainer.appendChild(bubble);
            }
            updateProgressBar();
        }

        function updateStats() {
            if (levelSpan) levelSpan.innerText = lessons[currentLvl].level;
            if (streakSpan) streakSpan.innerText = streak;
            updateLivesDisplay();
            updatePointsDisplay(false);
        }

        function showMessage(msg, isErr = false) {
            if (!feedbackDiv) return;
            feedbackDiv.innerHTML = msg;
            feedbackDiv.style.color = isErr ? 'var(--red)' : 'var(--green)';
            setTimeout(() => {
                if (feedbackDiv && feedbackDiv.innerHTML === msg) feedbackDiv.style.color = 'var(--gold-soft)';
            }, 1700);
        }

        function showGameOver() {
            gameCompleted = true;
            const container = document.getElementById('dynamicContent');
            container.innerHTML = `
                <div class="completion-premium">
                    <div>
                        <div class="badge" style="margin: 0 auto 22px; width: 86px; height: 86px; font-size: 2.5rem;">♡</div>
                        <h2 style="color:var(--red); font-family:'Playfair Display'; font-size:3rem;">OUT OF LIVES</h2>
                        <p style="color:var(--muted); margin: 14px 0 26px;">You scored <strong style="color:var(--gold-soft);">${totalPoints}</strong> points. Try again and keep the melody alive.</p>
                        <div class="home-buttons">
                            <button id="gameOverRestartBtn" class="home-btn home-btn-primary">RESTART GAME</button>
                            <button id="gameOverHomeBtn" class="home-btn">QUIT TO HOME</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('gameOverRestartBtn')?.addEventListener('click', () => fullReset());
            document.getElementById('gameOverHomeBtn')?.addEventListener('click', () => showHomepage());
        }

        function showCompletionWithNext() {
            gameCompleted = true;
            const container = document.getElementById('dynamicContent');
            container.innerHTML = `
                <div class="completion-premium">
                    <div>
                        <div class="badge" style="margin: 0 auto 22px; width: 86px; height: 86px; font-size: 2.5rem;">★</div>
                        <h2 style="color:var(--gold-soft); font-family:'Playfair Display'; font-size:3rem;">MAESTRO</h2>
                        <p style="color:var(--muted); margin: 14px 0 10px;">You completed all 5 golden lessons with ${lives} lives left!</p>
                        <p style="color:var(--gold-soft); font-size: 1.8rem; margin-bottom: 24px;">${totalPoints} POINTS</p>
                        <div class="home-buttons">
                            <button id="completeNextLessonBtn" class="home-btn home-btn-primary">NEXT LESSON</button>
                            <button id="completeRestartBtn" class="home-btn">RESTART GAME</button>
                            <button id="completeHomeBtn" class="home-btn">QUIT TO HOME</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('completeNextLessonBtn')?.addEventListener('click', () => {
                window.location.href = '/lesson2-4';
            });
            document.getElementById('completeRestartBtn')?.addEventListener('click', () => fullReset());
            document.getElementById('completeHomeBtn')?.addEventListener('click', () => showHomepage());
        }

        function advanceToNext() {
            if (currentLvl + 1 >= lessons.length) {
                showCompletionWithNext();
                return;
            }
            currentLvl++;
            userInput = [];
            streak++;
            updateStats();
            renderTargets();
            updatePreview();
            showMessage(`LEVEL ${lessons[currentLvl].level} - ${lessons[currentLvl].display} +${POINTS_PER_LESSON} POINTS!`);
            playSuccessSound();
        }

        function processNoteInput(note) {
            if (gameCompleted) return;
            playNote(note);
            animateKeyVisual(note);
            const expected = lessons[currentLvl].sequence[userInput.length];
            if (!expected) {
                showMessage("Sequence complete! Press verify or restart", false);
                return;
            }
            if (note === expected) {
                userInput.push(note);
                updatePreview();
                renderTargets();
                if (userInput.length === lessons[currentLvl].sequence.length) {
                    addPoints(POINTS_PER_LESSON, true);
                    showMessage(`PERFECT! +1 COMBO, +${POINTS_PER_LESSON} POINTS! LEVEL UP!`);
                    playSuccessSound();
                    advanceToNext();
                } else {
                    const nextExpected = lessons[currentLvl].sequence[userInput.length];
                    showMessage(`Great! Next: ${noteLabel(nextExpected)}`, false);
                    playSuccessSound();
                }
            } else {
                const livesLeft = loseLife();
                streak = 0;
                updateStats();
                playErrorSound();
                userInput = [];
                updatePreview();
                renderTargets();
                createParticles(window.innerWidth / 2, window.innerHeight / 2, false);
                if (livesLeft <= 0) {
                    showMessage("No lives left. Game over.", true);
                    setTimeout(showGameOver, 550);
                } else {
                    showMessage(`Wrong. Expected ${noteLabel(expected)}. ${livesLeft} lives left.`, true);
                }
            }
        }

        function manualVerify() {
            if (gameCompleted) return;
            const seq = lessons[currentLvl].sequence;
            if (userInput.length !== seq.length) {
                showMessage(`Play all ${seq.length} notes`, true);
                playErrorSound();
                return;
            }
            const correct = seq.every((note, index) => userInput[index] === note);
            if (correct) {
                addPoints(POINTS_PER_LESSON, true);
                showMessage(`Flawless! +${POINTS_PER_LESSON} POINTS! Advancing.`);
                playSuccessSound();
                advanceToNext();
                return;
            }
            const livesLeft = loseLife();
            streak = 0;
            updateStats();
            playErrorSound();
            userInput = [];
            updatePreview();
            renderTargets();
            if (livesLeft <= 0) showGameOver();
            else showMessage(`Wrong sequence. ${livesLeft} lives left.`, true);
        }

        function fullReset() {
            gameCompleted = false;
            currentLvl = 0;
            streak = 0;
            userInput = [];
            totalPoints = 0;
            lives = MAX_LIVES;
            rebuildGameUI();
            showMessage("Game restarted. Five hearts restored.");
        }

        function rebuildGameUI() {
            const mainDiv = document.getElementById('dynamicContent');
            mainDiv.innerHTML = `
                <section class="game-shell">
                    <div class="level-ribbon">♕ Level <span id="levelDigit">1</span></div>
                    <div class="challenge-header">
                        <div class="challenge-title">
                            <div class="mini-mark">▥</div>
                            <div>
                                <h1>Pianova</h1>
                                <p>Repeat the golden melody</p>
                            </div>
                        </div>
                        <button class="difficulty">♫ Beginner ˅</button>
                    </div>
                    <div class="melody-panel">
                        <div class="melody-title">MASTERPIECE SEQUENCE</div>
                        <div class="target-notes" id="targetNotesContainer"></div>
                    </div>
                    <div class="piano-premium">
                        <div id="cleanPianoMount"></div>
                    </div>
                    <p class="instruction">Click the piano keys in the glowing sequence</p>
                    <div class="input-preview">
                        <div class="preview-header">Your Progression</div>
                        <div class="preview-bubbles" id="previewBubbles"></div>
                    </div>
                    <div class="premium-actions">
                        <button id="restartBtnUI" class="btn-premium">RESTART</button>
                        <button id="verifyBtnUI" class="btn-premium btn-gold">VERIFY & CONTINUE</button>
                    </div>
                    <div class="feedback" id="feedbackMsg"></div>
                    <div class="info-grid">
                        <article class="info-card">
                            <div class="info-icon">◎</div>
                            <div>
                                <h3>Objective</h3>
                                <p>Repeat each sequence without losing all hearts</p>
                            </div>
                        </article>
                        <article class="info-card">
                            <div class="info-icon">★</div>
                            <div style="width: 100%;">
                                <h3>Lesson Combo</h3>
                                <div class="streak-dots" id="streakDots"></div>
                            </div>
                        </article>
                        <article class="info-card">
                            <div class="info-icon">♢</div>
                            <div>
                                <h3>Tip</h3>
                                <p>Follow the active golden card from left to right</p>
                            </div>
                        </article>
                    </div>
                </section>
            `;
            const mount = document.getElementById('cleanPianoMount');
            mount.innerHTML = buildCleanPiano();
            attachPianoEvents();
            levelSpan = document.getElementById('levelDigit');
            targetContainer = document.getElementById('targetNotesContainer');
            previewContainer = document.getElementById('previewBubbles');
            feedbackDiv = document.getElementById('feedbackMsg');
            progressFill = document.getElementById('progressBarFill');
            progressPercentSpan = document.getElementById('progressPercent');
            document.getElementById('restartBtnUI').addEventListener('click', fullReset);
            document.getElementById('verifyBtnUI').addEventListener('click', manualVerify);
            renderTargets();
            updatePreview();
            updateStats();
            renderStreakDots();
        }

        function renderStreakDots() {
            const dots = document.getElementById('streakDots');
            if (!dots) return;
            dots.innerHTML = Array.from({ length: lessons.length }, (_, index) => `<span class="dot${index < streak ? ' filled' : ''}"></span>`).join('');
        }

        function showHomepage() {
            const root = document.getElementById('appRoot');
            root.innerHTML = `
                <div class="homepage-container">
                    <div>
                        <div class="brand-mark" style="margin: 0 auto 22px;">▥</div>
                        <div class="homepage-logo">Pianova</div>
                        <div class="homepage-sub">Play • Learn • Master</div>
                        <div class="home-buttons">
                            <button id="homeStartBtn" class="home-btn home-btn-primary">START LESSONS</button>
                            <button id="homeQuitBtn" class="home-btn">QUIT GAME</button>
                        </div>
                        <div style="margin-top: 34px; color: var(--muted); font-size: 0.92rem;">Earn 250 points per lesson • 5 heart lives • Keyboard & click</div>
                    </div>
                </div>
            `;
            document.getElementById('homeStartBtn')?.addEventListener('click', () => loadGame());
            document.getElementById('homeQuitBtn')?.addEventListener('click', () => {
                root.innerHTML = `
                    <div class="homepage-container">
                        <div>
                            <div class="homepage-logo">Farewell</div>
                            <div class="homepage-sub">Thanks for playing Pianova. See you soon!</div>
                            <button id="quitReturnBtn" class="home-btn">RETURN TO HOME</button>
                        </div>
                    </div>
                `;
                document.getElementById('quitReturnBtn')?.addEventListener('click', () => showHomepage());
            });
        }

        function loadGame() {
            gameCompleted = false;
            currentLvl = 0;
            streak = 0;
            userInput = [];
            totalPoints = 0;
            lives = MAX_LIVES;
            const root = document.getElementById('appRoot');
            root.innerHTML = `
                ${renderTopbar()}
                ${renderScoreboard()}
                <div id="dynamicContent"></div>
            `;
            streakSpan = document.getElementById('streakDigit');
            document.getElementById('soundBtn')?.addEventListener('click', () => playTone(880));
            document.getElementById('settingsBtn')?.addEventListener('click', fullReset);
            rebuildGameUI();
            const unlock = () => {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            };
            document.body.addEventListener('click', unlock, { once: true });
        }

        function setupGlobalKeyboard() {
            window.addEventListener('keydown', (e) => {
                const gameContent = document.getElementById('dynamicContent');
                if (!gameContent || gameCompleted) return;
                const key = e.key.toLowerCase();
                const mapping = pianoNotes.find(p => p.keyChar === key);
                if (mapping) {
                    e.preventDefault();
                    const keyElement = document.querySelector(`.white-key[data-note="${mapping.note}"], .black-key[data-note="${mapping.note}"]`);
                    if (keyElement) {
                        const rect = keyElement.getBoundingClientRect();
                        createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, true);
                    }
                    processNoteInput(mapping.note);
                }
            });
        }

        setupGlobalKeyboard();
        showHomepage();
    </script>
</body>
</html>
