<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pianova | Rhythm Keys</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #f2bd57;
      --gold-soft: #ffe3a1;
      --cream: #fff3df;
      --muted: #d6c5a8;
      --red: #ff5368;
      --green: #a8ea7c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(circle at 7% 38%, rgba(242, 189, 87, 0.18), transparent 27%),
        radial-gradient(circle at 96% 45%, rgba(242, 189, 87, 0.22), transparent 26%),
        radial-gradient(circle at 50% 105%, rgba(118, 65, 23, 0.42), transparent 32%),
        #020303;
      padding: 8px 16px;
    }

    .music-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      color: rgba(242, 189, 87, 0.28);
      z-index: 0;
    }

    .music-bg span {
      position: absolute;
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 6vw, 6rem);
      filter: drop-shadow(0 0 18px rgba(242, 189, 87, 0.5));
      animation: floatNote 8s ease-in-out infinite;
    }

    .music-bg span:nth-child(1) { left: 2%; top: 35%; }
    .music-bg span:nth-child(2) { right: 2%; top: 28%; animation-delay: 1.4s; }
    .music-bg span:nth-child(3) { left: 4%; bottom: 12%; font-size: 2.4rem; animation-delay: 2.8s; }
    .music-bg span:nth-child(4) { right: 5%; bottom: 16%; font-size: 3.2rem; animation-delay: 3.6s; }

    @keyframes floatNote {
      0%, 100% { transform: translateY(0); opacity: 0.22; }
      50% { transform: translateY(-18px); opacity: 0.55; }
    }

    .stage {
      width: min(1180px, 100%);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 28px;
      align-items: center;
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark,
    .mini-mark {
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #13171d, #040506);
      border: 1px solid rgba(242, 189, 87, 0.45);
      box-shadow: 0 0 24px rgba(242, 189, 87, 0.22), inset 0 0 20px rgba(255, 227, 161, 0.06);
      color: var(--cream);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      font-size: 1.45rem;
    }

    .brand-title {
      font-family: "Playfair Display", serif;
      font-size: 1.95rem;
      line-height: 0.95;
      color: var(--gold-soft);
      text-shadow: 0 0 20px rgba(242, 189, 87, 0.42);
    }

    .brand-sub {
      color: var(--muted);
      margin-top: 4px;
      font-size: 0.84rem;
      letter-spacing: 0.02em;
    }

    .nav {
      justify-self: center;
      display: flex;
      gap: 12px;
      padding: 8px;
      border-radius: 18px;
      background: rgba(5, 7, 10, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.02);
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 15px;
      border: 1px solid transparent;
      color: #eee8dc;
      background: transparent;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-btn.active {
      color: var(--gold-soft);
      background: linear-gradient(145deg, rgba(242, 189, 87, 0.18), rgba(255, 255, 255, 0.03));
      box-shadow: inset 0 0 18px rgba(242, 189, 87, 0.08);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(242, 189, 87, 0.45);
      background: linear-gradient(145deg, rgba(13, 15, 19, 0.84), rgba(3, 4, 5, 0.92));
      color: var(--gold-soft);
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 18px rgba(242, 189, 87, 0.18), inset 0 0 14px rgba(255, 227, 161, 0.05);
    }

    .icon-btn:hover {
      background: linear-gradient(145deg, rgba(20, 24, 30, 0.92), rgba(5, 6, 8, 0.95));
      box-shadow: 0 0 24px rgba(242, 189, 87, 0.28), inset 0 0 18px rgba(255, 227, 161, 0.08);
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin-bottom: 8px;
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(12, 14, 19, 0.96), rgba(3, 4, 5, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.36), inset 0 0 34px rgba(255, 255, 255, 0.03);
    }

    .score-item {
      min-height: 62px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 17px;
      border-right: 1px solid rgba(255, 255, 255, 0.09);
    }

    .score-item:last-child { border-right: 0; }

    .badge {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 227, 161, 0.23), rgba(10, 11, 14, 0.92) 68%);
      border: 1px solid rgba(242, 189, 87, 0.68);
      box-shadow: 0 0 22px rgba(242, 189, 87, 0.18), inset 0 0 14px rgba(255, 227, 161, 0.08);
      font-size: 1.22rem;
    }

    .score-label {
      color: #f7ebd8;
      font-size: 0.9rem;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .score-number {
      color: var(--gold-soft);
      font-family: "Playfair Display", serif;
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1;
    }

    .combo-text {
      color: var(--gold);
      font-size: 1rem;
      font-weight: 800;
      margin-left: 4px;
    }

    .lives-row {
      display: flex;
      gap: 8px;
      font-size: 1.35rem;
      line-height: 1;
      text-shadow: 0 0 13px rgba(255, 83, 104, 0.55);
    }

    .heart { color: var(--red); }
    .heart.lost { color: #383b3f; opacity: 0.86; filter: grayscale(1); text-shadow: none; }

    .level-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .progress-track {
      width: 118px;
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #191c21;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffca4d, #fff0ad);
      box-shadow: 0 0 14px rgba(255, 202, 77, 0.8);
      transition: width 0.3s ease;
    }

    .game-shell {
      position: relative;
      padding: 14px 42px;
      border-radius: 38px;
      background: linear-gradient(180deg, rgba(9, 12, 15, 0.95), rgba(3, 4, 5, 0.96));
      border: 1px solid rgba(242, 189, 87, 0.62);
      box-shadow:
        0 0 0 1px rgba(255, 227, 161, 0.11),
        0 0 35px rgba(242, 189, 87, 0.25),
        inset 0 0 46px rgba(255, 227, 161, 0.05);
    }

    .level-ribbon {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 220px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #f7e7c7;
      background: linear-gradient(180deg, #080b0e, #0d0f13);
      border: 1px solid rgba(242, 189, 87, 0.72);
      border-top: 0;
      clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%);
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .challenge-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 6px;
    }

    .challenge-title {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .mini-mark {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      font-size: 1.45rem;
    }

    .challenge-title h1 {
      font-family: "Playfair Display", serif;
      color: var(--gold-soft);
      font-size: 1.65rem;
      line-height: 1;
      text-shadow: 0 0 18px rgba(242, 189, 87, 0.34);
    }

    .challenge-title p {
      color: #f3ebdf;
      margin-top: 3px;
      font-size: 0.88rem;
    }

    .difficulty {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 15px;
      color: var(--gold-soft);
      background: rgba(9, 11, 14, 0.84);
      border: 1px solid rgba(242, 189, 87, 0.38);
      box-shadow: inset 0 0 18px rgba(255, 227, 161, 0.05);
      font-weight: 800;
      font-size: 1rem;
    }

    .feedback {
      min-height: 22px;
      display: grid;
      place-items: center;
      margin-bottom: 5px;
      color: var(--gold-soft);
      font-weight: 800;
      font-size: 0.96rem;
      text-align: center;
    }

    .feedback.good { color: var(--green); text-shadow: 0 0 14px rgba(168, 234, 124, 0.4); }
    .feedback.bad { color: var(--red); text-shadow: 0 0 14px rgba(255, 83, 104, 0.45); }

    .rhythm-board {
      position: relative;
      height: 148px;
      margin-bottom: 7px;
      border-radius: 20px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02)),
        #101319;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 0 36px rgba(255, 255, 255, 0.05), 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .lane-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
    }

    .lane {
      position: relative;
      border-right: 1px solid rgba(255, 255, 255, 0.07);
      background: linear-gradient(180deg, transparent, rgba(242, 189, 87, 0.04));
    }

    .lane:last-child { border-right: 0; }

    .lane-label {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      color: rgba(255, 227, 161, 0.4);
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 0.78rem;
    }

    .strike-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 68px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
      box-shadow: 0 0 20px rgba(242, 189, 87, 0.8);
    }

    .hit-zone {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 38px;
      height: 66px;
      background: linear-gradient(180deg, transparent, rgba(242, 189, 87, 0.09), transparent);
      border-top: 1px solid rgba(242, 189, 87, 0.18);
      border-bottom: 1px solid rgba(242, 189, 87, 0.18);
    }

    .falling-note {
      position: absolute;
      width: 58px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #130d05;
      background: radial-gradient(circle at 35% 25%, #fff5c7, #ffd45b 55%, #bf7927 100%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 20px rgba(242, 189, 87, 0.5);
      font-weight: 900;
      transform: translateX(-50%);
    }

    .falling-note.danger {
      background: radial-gradient(circle at 35% 25%, #ffe0e4, #ff7080 55%, #8d1d2b 100%);
      color: #fff4f5;
      box-shadow: 0 0 22px rgba(255, 83, 104, 0.65);
    }

    .piano-premium {
      padding: 11px;
      margin-bottom: 8px;
      border-radius: 22px;
      background: #080a0d;
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.04);
      overflow-x: auto;
    }

    .piano-container {
      display: flex;
      justify-content: center;
      min-width: max-content;
    }

    .piano-keys {
      --white-key-width: 88px;
      --white-key-height: 104px;
      --black-key-width: 56px;
      --black-key-height: 64px;
      position: relative;
      width: calc(var(--white-key-width) * 9);
      min-width: calc(var(--white-key-width) * 9);
      height: var(--white-key-height);
      display: grid;
      grid-template-columns: repeat(9, var(--white-key-width));
      overflow: hidden;
      border-radius: 16px;
      background: #fff6e7;
    }

    .white-key,
    .black-key {
      font: inherit;
      border: 0;
      cursor: pointer;
      position: relative;
    }

    .white-key {
      z-index: 1;
      height: var(--white-key-height);
      background: linear-gradient(180deg, #fff8ed, #ead8bd);
      border-right: 2px solid rgba(36, 24, 12, 0.42);
      box-shadow: inset 0 -12px 18px rgba(117, 75, 35, 0.16);
      transition: transform 0.08s ease, filter 0.08s ease, box-shadow 0.08s ease;
    }

    .white-key:first-child { border-radius: 14px 0 0 14px; }
    .white-key:nth-of-type(9) { border-radius: 0 14px 14px 0; border-right: 0; }

    .white-key:active,
    .white-key.active-premium {
      transform: translateY(6px);
      filter: brightness(1.08);
      box-shadow: inset 0 0 24px rgba(242, 189, 87, 0.3);
    }

    .white-key.miss,
    .black-key.miss {
      box-shadow: inset 0 0 32px rgba(255, 83, 104, 0.62), 0 0 22px rgba(255, 83, 104, 0.55);
    }

    .black-key {
      position: absolute;
      top: 0;
      z-index: 3;
      width: var(--black-key-width);
      height: var(--black-key-height);
      border-radius: 0 0 9px 9px;
      color: var(--gold-soft);
      background: linear-gradient(180deg, #1d2025, #030405 72%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 6px 0 #000, 0 12px 22px rgba(0, 0, 0, 0.6);
      transition: transform 0.08s ease, filter 0.08s ease, box-shadow 0.08s ease;
    }

    .black-key:active,
    .black-key.active-premium {
      transform: translateY(5px);
      filter: brightness(1.18);
      box-shadow: 0 2px 0 #000, 0 8px 16px rgba(0, 0, 0, 0.55);
    }

    .key-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 800;
      color: #080808;
      pointer-events: none;
    }

    .black-key .key-label {
      top: 32px;
      bottom: auto;
      color: var(--gold-soft);
      font-size: 0.8rem;
    }

    .key-hotkey {
      display: block;
      margin-top: 4px;
      font-size: 0.55rem;
      color: rgba(0, 0, 0, 0.45);
      letter-spacing: 0.1em;
    }

    .black-key .key-hotkey { color: rgba(255, 227, 161, 0.55); }

    .instruction {
      text-align: center;
      color: #f4bd72;
      font-size: 0.86rem;
      margin: 4px 0 6px;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .primary-btn,
    .ghost-btn {
      border-radius: 17px;
      padding: 8px 16px;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--gold-soft);
      background: rgba(6, 8, 11, 0.82);
      border: 1px solid rgba(242, 189, 87, 0.62);
      box-shadow: inset 0 0 16px rgba(255, 227, 161, 0.04);
    }

    .primary-btn {
      color: #130d05;
      background: linear-gradient(135deg, #fff0ad, #f2bd57 55%, #b87a2a);
      border-color: rgba(255, 227, 161, 0.8);
      box-shadow: 0 0 24px rgba(242, 189, 87, 0.24);
    }

    .quit-btn {
      color: #ff7984;
      background: rgba(19, 5, 8, 0.78);
      border-color: rgba(255, 83, 104, 0.68);
      box-shadow: 0 0 18px rgba(255, 83, 104, 0.12), inset 0 0 16px rgba(255, 83, 104, 0.05);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 20px;
      margin-top: 8px;
    }

    .info-card {
      min-height: 52px;
      border-radius: 17px;
      background: rgba(9, 12, 16, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .info-icon {
      font-size: 1.3rem;
      color: var(--gold-soft);
      text-shadow: 0 0 12px rgba(242, 189, 87, 0.38);
    }

    .info-card h3 {
      color: var(--gold-soft);
      font-size: 0.9rem;
      margin-bottom: 3px;
    }

    .info-card p {
      color: #eee3d1;
      font-size: 0.75rem;
      line-height: 1.2;
    }

    .streak-dots {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #13161a;
    }

    .dot.filled {
      background: radial-gradient(circle, #fff1a5 0%, #ffc73e 55%, #b66e18 100%);
      box-shadow: 0 0 13px rgba(255, 199, 62, 0.7);
    }

    .home-screen,
    .completion-screen {
      min-height: calc(100vh - 16px);
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 38px;
      background: linear-gradient(180deg, rgba(9, 12, 15, 0.91), rgba(3, 4, 5, 0.95));
      border: 1px solid rgba(242, 189, 87, 0.48);
      box-shadow: 0 0 34px rgba(242, 189, 87, 0.18);
      padding: 42px;
    }

    .home-logo {
      font-family: "Playfair Display", serif;
      font-size: clamp(3.8rem, 9vw, 7rem);
      color: var(--gold-soft);
      text-shadow: 0 0 28px rgba(242, 189, 87, 0.5);
      margin-bottom: 12px;
    }

    .home-sub {
      color: #f3e6ce;
      font-size: 1.25rem;
      margin-bottom: 34px;
    }

    .home-actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .completion-screen h2 {
      font-family: "Playfair Display", serif;
      font-size: 3rem;
      color: var(--gold-soft);
      margin-bottom: 14px;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      animation: particleFade 0.6s ease-out forwards;
      z-index: 1000;
    }

    @keyframes particleFade {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(0); opacity: 0; }
    }

    @media (max-width: 1050px) {
      .topbar { grid-template-columns: 1fr; }
      .brand { justify-content: center; }
      .nav {
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
      }
      .scoreboard { grid-template-columns: repeat(2, 1fr); }
      .score-item:nth-child(2) { border-right: 0; }
      .score-item:nth-child(-n + 2) { border-bottom: 1px solid rgba(255, 255, 255, 0.09); }
      .game-shell { padding: 18px 18px; }
      .info-grid { grid-template-columns: 1fr; }
      .piano-container { justify-content: flex-start; }
    }

    @media (max-width: 760px) {
      body { padding: 12px 9px; }
      .brand-title { font-size: 2rem; }
      .brand-mark { width: 46px; height: 46px; }
      .scoreboard { grid-template-columns: 1fr; }
      .score-item {
        min-height: 74px;
        border-right: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        padding: 12px 18px;
      }
      .score-item:last-child { border-bottom: 0; }
      .game-shell { border-radius: 26px; padding: 20px 14px; }
      .challenge-header { flex-direction: column; align-items: stretch; margin-top: 20px; }
      .difficulty { justify-content: center; }
      .rhythm-board { height: 240px; }
      .falling-note {
        width: 44px;
        height: 38px;
        border-radius: 13px;
        font-size: 0.86rem;
      }
      .piano-keys {
        --white-key-width: 74px;
        --white-key-height: 160px;
        --black-key-width: 50px;
        --black-key-height: 92px;
      }
      .key-label { bottom: 20px; font-size: 1.08rem; }
      .black-key .key-label { top: 60px; font-size: 0.92rem; }
    }
  </style>
</head>

<body>
  <div class="music-bg" aria-hidden="true">
    <span>𝄞</span>
    <span>♫</span>
    <span>♪</span>
    <span>♬</span>
  </div>

  <main class="stage" id="appRoot"></main>

  <script>
    let audioCtx = null;

    const MAX_LIVES = 5;
    const HIT_ZONE = 72;
    const MISS_ZONE = 112;
    const HIT_TOLERANCE = 60;

    const pianoNotes = [
      { note: 'C4', type: 'white', keyChar: 'a', label: 'C', lane: 0 },
      { note: 'C#4', type: 'black', keyChar: 'w', label: 'C#', afterWhite: 1 },
      { note: 'D4', type: 'white', keyChar: 's', label: 'D', lane: 1 },
      { note: 'D#4', type: 'black', keyChar: 'e', label: 'D#', afterWhite: 2 },
      { note: 'E4', type: 'white', keyChar: 'd', label: 'E', lane: 2 },
      { note: 'F4', type: 'white', keyChar: 'f', label: 'F', lane: 3 },
      { note: 'F#4', type: 'black', keyChar: 't', label: 'F#', afterWhite: 4 },
      { note: 'G4', type: 'white', keyChar: 'g', label: 'G', lane: 4 },
      { note: 'G#4', type: 'black', keyChar: 'y', label: 'G#', afterWhite: 5 },
      { note: 'A4', type: 'white', keyChar: 'h', label: 'A', lane: 5 },
      { note: 'A#4', type: 'black', keyChar: 'u', label: 'A#', afterWhite: 6 },
      { note: 'B4', type: 'white', keyChar: 'j', label: 'B', lane: 6 },
      { note: 'C5', type: 'white', keyChar: 'k', label: 'C', lane: 7 },
      { note: 'D5', type: 'white', keyChar: 'l', label: 'D' }
    ];

    const lanes = pianoNotes.filter(note => note.type === 'white' && note.lane !== undefined);

    const freqMap = {
      C4: 261.63,
      'C#4': 277.18,
      D4: 293.66,
      'D#4': 311.13,
      E4: 329.63,
      F4: 349.23,
      'F#4': 369.99,
      G4: 392.00,
      'G#4': 415.30,
      A4: 440.00,
      'A#4': 466.16,
      B4: 493.88,
      C5: 523.25,
      D5: 587.33
    };

    const songs = [
      { name: 'Golden Steps', notes: ['C4', 'D4', 'E4', 'G4', 'E4', 'D4', 'C4', 'G4'] },
      { name: 'Moonlit Scale', notes: ['E4', 'F4', 'G4', 'A4', 'B4', 'A4', 'G4', 'E4'] },
      { name: 'Maestro Run', notes: ['C4', 'E4', 'G4', 'C5', 'B4', 'A4', 'G4', 'F4', 'E4', 'D4'] }
    ];

    let score = 0;
    let combo = 0;
    let lives = MAX_LIVES;
    let level = 1;
    let activeNotes = [];
    let spawnIndex = 0;
    let lastSpawn = 0;
    let speed = 78;
    let spawnGap = 1450;
    let running = false;
    let paused = false;
    let lastFrame = 0;
    let animationId = null;

    const root = document.getElementById('appRoot');

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function unlockAudio() {
      const ctx = initAudio();
      if (ctx.state === 'suspended') ctx.resume();
    }

    function playNote(note) {
      if (!freqMap[note]) return;
      const ctx = initAudio();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.value = freqMap[note];

      gain.gain.setValueAtTime(0.34, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(now + 0.55);
    }

    function playTone(freq, type = 'sine') {
      const ctx = initAudio();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(now + 0.24);
    }

    function label(note) {
      return note.replace('4', '').replace('5', '');
    }

    function currentSong() {
      return songs[Math.min(level - 1, songs.length - 1)];
    }

    function renderTopbar() {
      return `
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark">▥</div>
            <div>
              <div class="brand-title">Pianova♪</div>
              <div class="brand-sub">Play • Learn • Master</div>
            </div>
          </div>

          <nav class="nav" aria-label="Game navigation">
            <button class="nav-btn active">⌂ Home</button>
            <button class="nav-btn">♕ Leaderboard</button>
            <button class="nav-btn">♙ Profile</button>
            <button class="nav-btn" onclick="window.location.href='/lessons'">⏻ exit</button>
          </nav>

          <div class="top-actions">
            <button class="icon-btn" id="soundBtn" title="Sound">♪</button>
            <button class="icon-btn" onclick="location.reload()" title="Restart">⚙</button>
          </div>
        </header>
      `;
    }

    function renderScoreboard() {
      const progress = Math.min(100, Math.round((spawnIndex / currentSong().notes.length) * 100));

      return `
        <section class="scoreboard">
          <div class="score-item">
            <div class="badge">★</div>
            <div>
              <div class="score-label">Score</div>
              <div class="score-number" id="scoreValue">${score}</div>
            </div>
          </div>

          <div class="score-item">
            <div class="badge">♨</div>
            <div>
              <div class="score-label">Combo</div>
              <div>
                <span class="score-number" id="comboValue">${combo}</span>
                <span class="combo-text">${combo >= 8 ? 'Perfect!' : 'Streak!'}</span>
              </div>
            </div>
          </div>

          <div class="score-item">
            <div class="badge" style="border-color: rgba(255,83,104,.55);">♥</div>
            <div>
              <div class="score-label">Lives</div>
              <div class="lives-row" id="livesValue">${renderHearts()}</div>
            </div>
          </div>

          <div class="score-item">
            <div>
              <div class="score-label">LESSON 4</div>
              <div class="level-progress">
                <div class="progress-track">
                  <div class="progress-fill" id="progressFill" style="width:${progress}%"></div>
                </div>
                <strong id="progressText">${progress}%</strong>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderHearts() {
      return Array.from({ length: MAX_LIVES }, (_, index) => {
        return `<span class="heart${index >= lives ? ' lost' : ''}">${index < lives ? '♥' : '♡'}</span>`;
      }).join('');
    }

    function buildPiano() {
      const whiteKeysHtml = pianoNotes
        .filter(key => key.type === 'white')
        .map(key => `
          <button class="white-key" data-note="${key.note}" type="button">
            <span class="key-label">${key.label}<span class="key-hotkey">${key.keyChar.toUpperCase()}</span></span>
          </button>
        `)
        .join('');

      const blackKeysHtml = pianoNotes
        .filter(key => key.type === 'black')
        .map(key => `
          <button
            class="black-key"
            data-note="${key.note}"
            type="button"
            style="left: calc((var(--white-key-width) * ${key.afterWhite}) - (var(--black-key-width) / 2));"
          >
            <span class="key-label">${key.label}<span class="key-hotkey">${key.keyChar.toUpperCase()}</span></span>
          </button>
        `)
        .join('');

      return `<div class="piano-container"><div class="piano-keys">${whiteKeysHtml}${blackKeysHtml}</div></div>`;
    }

    function renderHome() {
      stopGame();

      root.innerHTML = `
        <section class="home-screen">
          <div>
            <div class="brand-mark" style="margin: 0 auto 22px;">▥</div>
            <div class="home-logo">Pianova</div>
            <p class="home-sub">Rhythm Keys • Hit falling notes on time</p>
            <div class="home-actions">
              <button class="primary-btn" id="startBtn">Start Rhythm Keys</button>
              <button class="ghost-btn" id="practiceBtn">Practice</button>
            </div>
          </div>
        </section>
      `;

      document.getElementById('startBtn').addEventListener('click', startGame);
      document.getElementById('practiceBtn').addEventListener('click', startGame);
    }

    function renderGame() {
      root.innerHTML = `
        ${renderTopbar()}
        ${renderScoreboard()}

        <section class="game-shell">
          <div class="level-ribbon">♕ LESSON 4</div>

          <div class="challenge-header">
            <div class="challenge-title">
              <div class="mini-mark">▥</div>
              <div>
                <h1>Rhythm Keys</h1>
                <p>Hit notes when they touch the glowing line</p>
              </div>
            </div>

            <button class="difficulty">♫ ${currentSong().name} ˅</button>
          </div>

          <div class="feedback" id="feedbackLine">Ready. Watch the falling notes.</div>

          <div class="rhythm-board" id="rhythmBoard">
            <div class="lane-grid">
              ${lanes.map(note => `<div class="lane"><div class="lane-label">${note.label}</div></div>`).join('')}
            </div>
            <div class="hit-zone"></div>
            <div class="strike-line"></div>
          </div>

          <div class="piano-premium">${buildPiano()}</div>

          <p class="instruction">Use A S D F G H J K, or click the piano keys</p>

          <div class="controls-row">
            <button class="primary-btn" id="pauseBtn">Start Song</button>
            <button class="ghost-btn" id="restartBtn">Restart Song</button>
            <button class="ghost-btn quit-btn" id="quitBtn">Quit Game</button>
          </div>

          <div class="info-grid">
            <article class="info-card">
              <div class="info-icon">◎</div>
              <div>
                <h3>Objective</h3>
                <p>Hit each falling note inside the glowing timing zone</p>
              </div>
            </article>

            <article class="info-card">
              <div class="info-icon">★</div>
              <div style="width: 100%;">
                <h3>Combo Chain</h3>
                <div class="streak-dots" id="comboDots"></div>
              </div>
            </article>

            <article class="info-card">
              <div class="info-icon">♢</div>
              <div>
                <h3>Tip</h3>
                <p>Wait until the note reaches the gold line for bonus score</p>
              </div>
            </article>
          </div>
        </section>
      `;

      bindGameEvents();
      updateStats();
    }

    function bindGameEvents() {
      document.querySelectorAll('[data-note]').forEach(key => {
        key.addEventListener('click', () => hitKey(key.dataset.note));
      });

      document.getElementById('restartBtn').addEventListener('click', restartLevel);
      document.getElementById('pauseBtn').addEventListener('click', togglePause);
      document.getElementById('quitBtn').addEventListener('click', quitGame);
    }

    function quitGame() {
      stopGame();
      renderHome();
    }

    function startGame() {
      score = 0;
      combo = 0;
      lives = MAX_LIVES;
      level = 1;
      speed = 78;
      spawnGap = 1450;

      resetSongState();
      renderGame();

      running = true;
      paused = true;
      lastFrame = performance.now();
      lastSpawn = lastFrame;

      setFeedback('Press Start Song when ready', true);
    }

    function restartLevel() {
      combo = 0;
      resetSongState();
      renderGame();

      running = true;
      paused = true;
      lastFrame = performance.now();
      lastSpawn = lastFrame;

      setFeedback('Press Start Song when ready', true);
    }

    function resetSongState() {
      activeNotes = [];
      spawnIndex = 0;
      lastSpawn = 0;

      if (animationId) cancelAnimationFrame(animationId);
    }

    function stopGame() {
      running = false;
      paused = false;

      if (animationId) cancelAnimationFrame(animationId);
      animationId = null;
    }

    function togglePause() {
      paused = !paused;

      const btn = document.getElementById('pauseBtn');
      if (btn) btn.textContent = paused ? 'Resume' : 'Pause';

      if (!paused) {
        unlockAudio();
        playTone(660);

        lastFrame = performance.now();
        lastSpawn = performance.now() - 250;

        animationId = requestAnimationFrame(gameLoop);
      }
    }

    function gameLoop(now) {
      if (!running || paused) return;

      const board = document.getElementById('rhythmBoard');
      if (!board) return;

      const delta = Math.min((now - lastFrame) / 1000, 0.05);
      lastFrame = now;

      if (now - lastSpawn > spawnGap && spawnIndex < currentSong().notes.length) {
        spawnNote(currentSong().notes[spawnIndex]);
        spawnIndex++;
        lastSpawn = now;
        updateStats();
      }

      activeNotes.forEach(item => {
        item.y += speed * delta;
        item.el.style.top = `${item.y}px`;

        if (item.y > board.clientHeight - MISS_ZONE) {
          item.el.classList.add('danger');
        }
      });

      const missed = activeNotes.filter(item => item.y > board.clientHeight - 18);
      missed.forEach(item => missNote(item));

      activeNotes = activeNotes.filter(item => item.y <= board.clientHeight - 18 && !item.hit);

      if (spawnIndex >= currentSong().notes.length && activeNotes.length === 0) {
        advanceLevel();
        return;
      }

      animationId = requestAnimationFrame(gameLoop);
    }

    function spawnNote(note) {
      const board = document.getElementById('rhythmBoard');
      if (!board) return;

      const lane = lanes.findIndex(item => item.note === note);
      if (lane < 0) return;

      const el = document.createElement('div');
      el.className = 'falling-note';
      el.textContent = label(note);

      const laneWidth = board.clientWidth / lanes.length;

      el.style.left = `${laneWidth * lane + laneWidth / 2}px`;
      el.style.top = `-48px`;

      board.appendChild(el);

      activeNotes.push({
        note,
        lane,
        y: -48,
        el,
        hit: false
      });
    }

    function hitKey(note) {
      if (!running || paused) return;

      playNote(note);
      animateKey(note);

      const board = document.getElementById('rhythmBoard');
      if (!board) return;

      const lane = lanes.findIndex(item => item.note === note);

      if (lane < 0) {
        setFeedback(`${label(note)} sound`, true);
        return;
      }

      const targetY = board.clientHeight - HIT_ZONE;

      const candidates = activeNotes
        .filter(item => item.lane === lane && !item.hit)
        .map(item => ({ item, distance: Math.abs(item.y - targetY) }))
        .sort((a, b) => a.distance - b.distance);

      if (candidates.length && candidates[0].distance <= HIT_TOLERANCE) {
        score += candidates[0].distance <= 18 ? 150 : 100;
        combo++;

        markHit(candidates[0].item, candidates[0].distance <= 18 ? 'Perfect!' : 'Great!');
      } else {
        combo = 0;
        loseLife(`Missed timing on ${label(note)}`);
        flashKey(note, true);
      }

      updateStats();
    }

    function markHit(item, text) {
      item.hit = true;
      item.el.remove();

      activeNotes = activeNotes.filter(note => note !== item);

      setFeedback(`Correct answer! ${text} You played ${label(item.note)}.`, true);
      createParticlesAtBoard(item.lane, true);
      playTone(1046.5);
    }

    function missNote(item) {
      item.hit = true;
      item.el.remove();

      combo = 0;

      loseLife(`Missed ${label(item.note)}`);
      createParticlesAtBoard(item.lane, false);
    }

    function loseLife(message) {
      lives = Math.max(0, lives - 1);

      setFeedback(`Wrong answer! ${message}. ${lives} lives left.`, false);
      playTone(180, 'sawtooth');

      if (lives <= 0) {
        stopGame();
        setTimeout(() => showCompletion(false), 650);
      }
    }

    function advanceLevel() {
      if (level >= songs.length) {
        stopGame();
        showCompletion(true);
        return;
      }

      level++;
      combo = 0;
      speed += 18;
      spawnGap = Math.max(880, spawnGap - 130);

      resetSongState();
      renderGame();

      running = true;
      paused = true;
      lastFrame = performance.now();
      lastSpawn = lastFrame;

      setFeedback(`Level ${level}: ${currentSong().name}`, true);
      playTone(784);
    }

    function updateStats() {
      const scoreValue = document.getElementById('scoreValue');
      const comboValue = document.getElementById('comboValue');
      const livesValue = document.getElementById('livesValue');
      const levelValue = document.getElementById('levelValue');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const comboDots = document.getElementById('comboDots');

      const progress = Math.min(100, Math.round((spawnIndex / currentSong().notes.length) * 100));

      if (scoreValue) scoreValue.textContent = score;
      if (comboValue) comboValue.textContent = combo;
      if (livesValue) livesValue.innerHTML = renderHearts();
      if (levelValue) levelValue.textContent = level;
      if (progressFill) progressFill.style.width = `${progress}%`;
      if (progressText) progressText.textContent = `${progress}%`;

      if (comboDots) {
        comboDots.innerHTML = Array.from({ length: 8 }, (_, index) => {
          return `<span class="dot${index < Math.min(combo, 8) ? ' filled' : ''}"></span>`;
        }).join('');
      }
    }

    function setFeedback(message, good) {
      const feedback = document.getElementById('feedbackLine');
      if (!feedback) return;

      feedback.textContent = message;
      feedback.className = `feedback ${good ? 'good' : 'bad'}`;

      setTimeout(() => {
        if (feedback.textContent === message) {
          feedback.textContent = paused ? 'Paused' : 'Follow the falling notes';
          feedback.className = 'feedback';
        }
      }, 900);
    }

    function animateKey(note) {
      const key = document.querySelector(`[data-note="${note}"]`);
      if (!key) return;

      key.classList.add('active-premium');
      setTimeout(() => key.classList.remove('active-premium'), 150);
    }

    function flashKey(note, bad) {
      const key = document.querySelector(`[data-note="${note}"]`);
      if (!key || !bad) return;

      key.classList.add('miss');
      setTimeout(() => key.classList.remove('miss'), 260);
    }

    function createParticlesAtBoard(lane, good) {
      const board = document.getElementById('rhythmBoard');
      if (!board) return;

      const rect = board.getBoundingClientRect();
      const laneWidth = rect.width / lanes.length;

      const x = rect.left + laneWidth * lane + laneWidth / 2;
      const y = rect.bottom - HIT_ZONE;

      for (let i = 0; i < (good ? 12 : 7); i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';

        const size = Math.random() * 7 + 4;

        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${x + (Math.random() - 0.5) * 58}px`;
        particle.style.top = `${y + (Math.random() - 0.5) * 42}px`;
        particle.style.background = good
          ? 'radial-gradient(circle, #ffe59b, #f2bd57)'
          : 'radial-gradient(circle, #ff8a98, #ff5368)';

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 600);
      }
    }

    function showCompletion(won) {
      if (audioCtx) playTone(won ? 988 : 220, won ? 'sine' : 'sawtooth');

      root.innerHTML = `
        ${renderTopbar()}
        ${renderScoreboard()}

        <section class="completion-screen">
          <div>
            <div class="badge" style="margin: 0 auto 22px; width: 86px; height: 86px; font-size: 2.5rem;">
              ${won ? '★' : '♥'}
            </div>

            <h2>${won ? 'Rhythm Maestro!' : 'Out of Lives'}</h2>

            <p style="color: var(--muted); margin-bottom: 26px;">
              Final score: <strong style="color: var(--gold-soft);">${score}</strong>
            </p>

            <div class="home-actions">
              <button class="primary-btn" id="playAgainBtn">Play Again</button>
              <button class="ghost-btn" id="homeBtn">Home</button>
            </div>
          </div>
        </section>
      `;

      document.getElementById('playAgainBtn').addEventListener('click', startGame);
      document.getElementById('homeBtn').addEventListener('click', renderHome);
    }

    window.addEventListener('keydown', event => {
      if (!running || paused) return;

      const found = pianoNotes.find(note => note.keyChar === event.key.toLowerCase());
      if (!found) return;

      event.preventDefault();
      hitKey(found.note);
    });

    window.addEventListener('blur', () => {
      if (running && !paused) togglePause();
    });

    renderHome();
  </script>
</body>
</html>
