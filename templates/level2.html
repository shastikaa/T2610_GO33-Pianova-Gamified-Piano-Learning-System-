<style>

    width: 100%;
    min-height: 100%;
    border-radius: 38px;
    background:
        radial-gradient(circle at 50% 24%, rgba(255, 226, 154, 0.22), transparent 24%),
        radial-gradient(circle at 18% 72%, rgba(241, 189, 87, 0.16), transparent 24%),

    box-shadow:
        0 0 0 1px rgba(255, 226, 154, 0.14),

    0%, 100% { transform: translateY(0) rotate(-4deg); opacity: 0.22; }
    50% { transform: translateY(-22px) rotate(4deg); opacity: 0.5; }
}

.lesson2-content {
    position: relative;
    z-index: 1;
    max-width: 780px;

<script>
function showLesson2Intro() {
    const game = document.getElementById("game-container");

    if (!game) {
        alert("Missing game-container");
        return;
    }

    game.innerHTML = `
        <section class="lesson2-intro">
            <div class="lesson2-notes" aria-hidden="true">
                <span>𝄞</span>
                <span>♪</span>
                <span>♫</span>
                <span>♬</span>
            </div>

            <div class="lesson2-content">
                <div class="lesson2-mark">▥</div>
                <p class="lesson2-kicker">Pianova Presents</p>
                <h1>Lesson 2</h1>
                <h2>The Grand Staff Awakens</h2>

                <p class="lesson2-subtitle">
                    You have completed Lesson 1. Now Pianova opens the next stage:
                    sharper notes, stronger rhythm, and a brighter path toward mastery.
                </p>

                <div class="lesson2-highlights">
                    <div class="lesson2-chip">New Challenge</div>
                    <div class="lesson2-chip">Score Continues</div>
                    <div class="lesson2-chip">5 Heart Lives</div>
                    <div class="lesson2-chip">Keyboard & Click</div>
                </div>

                <div class="lesson2-actions">
                    <button class="lesson2-start-btn" onclick="startLesson2()">Start Lesson 2</button>
                    <button class="lesson2-back-btn" onclick="restartGame()">Back to Lesson 1</button>
                </div>
            </div>
        </section>
    `;
}

function startLesson2() {
    if (typeof currentLevel !== "undefined") currentLevel = 2;
    if (typeof levelCorrect !== "undefined") levelCorrect = 0;
    if (typeof lives !== "undefined" && typeof maxLives !== "undefined") lives = maxLives;
    if (typeof combo !== "undefined") combo = 0;

    if (typeof renderGameShell === "function") {
        renderGameShell();
    } else if (typeof newQuestion === "function") {
        newQuestion();
    }
}
</script>
