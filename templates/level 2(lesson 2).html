<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pianova - Triad Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #f2bd57;
            --gold-soft: #ffe3a1;
            --cream: #fff3df;
            --muted: #d6c5a8;
            --red: #ff5368;
            --green: #a8ea7c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Inter, sans-serif;
            color: var(--cream);
            background:
                radial-gradient(circle at 0% 0%, rgba(242, 189, 87, 0.18), transparent 28%),
                radial-gradient(circle at 100% 0%, rgba(242, 189, 87, 0.16), transparent 28%),
                radial-gradient(circle at 50% 110%, rgba(118, 65, 23, 0.38), transparent 32%),
                #020303;
            padding: 0 20px 14px;
        }

        .music-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: rgba(242, 189, 87, 0.16);
            z-index: 0;
            overflow: hidden;
            font-family: "Playfair Display", serif;
        }

        .music-bg span {
            position: absolute;
            font-size: clamp(2.4rem, 7vw, 7rem);
            filter: drop-shadow(0 0 18px rgba(242, 189, 87, 0.35));
            animation: floatNote 8s ease-in-out infinite;
        }

        .music-bg span:nth-child(1) { left: 2%; top: 36%; }
        .music-bg span:nth-child(2) { right: 3%; top: 34%; animation-delay: 1.4s; }
        .music-bg span:nth-child(3) { left: 5%; bottom: 10%; font-size: 2.4rem; animation-delay: 2.5s; }
        .music-bg span:nth-child(4) { right: 6%; bottom: 15%; font-size: 3.5rem; animation-delay: 3.5s; }

        @keyframes floatNote {
            0%, 100% { transform: translateY(0); opacity: 0.2; }
            50% { transform: translateY(-18px); opacity: 0.44; }
        }

        .stage {
            width: min(1500px, calc(100% - 32px));
            min-height: calc(100vh - 28px);
            margin: 0 auto;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform-origin: top center;
        }

        .topbar {
            display: grid;
            grid-template-columns: minmax(280px, auto) 1fr auto;
            align-items: center;
            gap: 32px;
            height: 76px;
            padding: 0 30px;
            border-radius: 32px;
            background:
                radial-gradient(circle at 7% 50%, rgba(242, 189, 87, 0.3), transparent 24%),
                radial-gradient(circle at 92% 50%, rgba(242, 189, 87, 0.24), transparent 24%),
                linear-gradient(180deg, rgba(24, 22, 12, 0.98), rgba(4, 5, 5, 0.98));
            border: 1px solid rgba(242, 189, 87, 0.28);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.38), inset 0 0 30px rgba(255, 227, 161, 0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 400px;
        }

        .brand-mark,
        .mini-mark {
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #13171d, #040506);
            border: 1px solid rgba(242, 189, 87, 0.45);
            box-shadow: 0 0 24px rgba(242, 189, 87, 0.22), inset 0 0 20px rgba(255, 227, 161, 0.06);
            color: var(--cream);
        }

        .brand-mark {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            border-color: rgba(242, 189, 87, 0.78);
            font-size: 2rem;
        }

        .brand-title {
            font-family: "Playfair Display", serif;
            font-size: 2.8rem;
            line-height: 0.82;
            color: var(--gold-soft);
            text-shadow: 0 0 20px rgba(242, 189, 87, 0.42);
        }

        .brand-sub {
            color: var(--muted);
            margin-top: 4px;
            font-size: 1.02rem;
            font-weight: 800;
        }

        .nav {
            justify-self: center;
            display: flex;
            gap: 22px;
            padding: 10px 12px;
            border-radius: 24px;
            background: rgba(2, 3, 4, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-btn,
        .icon-btn,
        .difficulty {
            font: inherit;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .nav-btn {
            padding: 14px 26px;
            border-radius: 17px;
            color: #eee8dc;
            background: transparent;
            font-weight: 800;
            white-space: nowrap;
            font-size: 1.05rem;
        }

        .nav-btn.active {
            color: var(--gold-soft);
            background: rgba(242, 189, 87, 0.13);
        }

        .top-actions {
            display: flex;
            justify-content: flex-end;
            gap: 18px;
        }

        .icon-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: var(--gold-soft);
            background: rgba(5, 6, 8, 0.72);
            border-color: rgba(242, 189, 87, 0.82);
            box-shadow: 0 0 22px rgba(242, 189, 87, 0.2);
            font-size: 1.35rem;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-radius: 27px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(13, 16, 22, 0.96), rgba(4, 5, 7, 0.96));
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.36), inset 0 0 34px rgba(255, 255, 255, 0.03);
        }

        .score-item {
            min-height: 94px;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.09);
        }

        .score-item:last-child { border-right: 0; }

        .badge {
            width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 227, 161, 0.23), rgba(10, 11, 14, 0.92) 68%);
            border: 1px solid rgba(242, 189, 87, 0.68);
            font-size: 1.9rem;
        }

        .score-label {
            color: #f7ebd8;
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .score-number {
            color: var(--gold-soft);
            font-family: "Playfair Display", serif;
            font-size: 2.15rem;
            font-weight: 800;
            line-height: 1;
        }

        .combo-text {
            color: var(--gold);
            font-size: 1rem;
            font-weight: 800;
            margin-left: 8px;
        }

        .lives-row {
            display: flex;
            gap: 8px;
            color: var(--red);
            font-size: 1.35rem;
            text-shadow: 0 0 13px rgba(255, 83, 104, 0.55);
        }

        .level-progress {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 10px;
        }

        .progress-track {
            width: 150px;
            height: 12px;
            overflow: hidden;
            border-radius: 999px;
            background: #191c21;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ffca4d, #fff0ad);
            box-shadow: 0 0 14px rgba(255, 202, 77, 0.8);
            transition: width 0.3s ease;
        }

        .game-shell {
            flex: 1;
            min-height: 0;
            position: relative;
            padding: 38px 46px 22px;
            border-radius: 36px;
            background:
                radial-gradient(circle at 50% 0%, rgba(242,189,87,0.08), transparent 30%),
                linear-gradient(180deg, rgba(8,11,14,0.98), rgba(1,2,3,0.98));
            border: 1px solid rgba(242, 189, 87, 0.72);
            box-shadow:
                0 0 0 1px rgba(255, 227, 161, 0.11),
                0 0 35px rgba(242, 189, 87, 0.25),
                inset 0 0 46px rgba(255, 227, 161, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .level-ribbon {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 180px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f7e7c7;
            background: linear-gradient(180deg, #080b0e, #0d0f13);
            border: 1px solid rgba(242, 189, 87, 0.72);
            border-top: 0;
            clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%);
            font-weight: 900;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            font-size: 1rem;
        }

        .challenge-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 2px;
            margin-bottom: 20px;
        }

        .challenge-title {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .mini-mark {
            width: 74px;
            height: 74px;
            border-radius: 18px;
            font-size: 1.85rem;
        }

        .challenge-title h1 {
            font-family: "Playfair Display", serif;
            color: var(--gold-soft);
            font-size: 2.65rem;
            line-height: 1;
        }

        .challenge-title p {
            color: #f3ebdf;
            margin-top: 5px;
            font-size: 1.25rem;
            font-weight: 800;
        }

        .difficulty {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 17px 24px;
            border-radius: 17px;
            color: var(--gold-soft);
            background: rgba(9, 11, 14, 0.84);
            border-color: rgba(242, 189, 87, 0.46);
            font-weight: 900;
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.85;
        }

        .instruction-main {
            text-align: center;
            color: var(--gold-soft);
            font-size: 1.45rem;
            font-weight: 900;
            margin: 2px 0 18px;
        }

        .target-panel {
            height: 162px;
            border-radius: 18px;
            padding: 15px 28px;
            margin-bottom: 14px;
            background: linear-gradient(180deg, #30343a, #181b20);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: grid;
            place-items: center;
        }

        .target-card {
            width: min(1016px, 100%);
            height: 100%;
            border-radius: 18px;
            background: #f3e7d1;
            box-shadow: inset 0 0 18px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
            position: relative;
            overflow: hidden;
        }

        .staff-lines {
            position: absolute;
            left: 80px;
            right: 80px;
            top: 50%;
            height: 76px;
            transform: translateY(-50%);
            background: repeating-linear-gradient(
                to bottom,
                transparent 0 12px,
                #282828 13px 15px,
                transparent 16px 17px
            );
        }

        .clef {
            position: absolute;
            left: 112px;
            top: 50%;
            transform: translateY(-45%);
            font-family: "Playfair Display", serif;
            font-size: 5.5rem;
            line-height: 1;
            color: #252525;
        }

        #target-notes {
            position: relative;
            z-index: 2;
            color: #111;
            font-size: 2rem;
            font-weight: 900;
            font-family: Inter, sans-serif;
            letter-spacing: 8px;
        }

        .piano-container {
            background: #090b0e;
            padding: 12px;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            min-height: 210px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow-x: auto;
            overflow-y: hidden;
        }

        .piano-wrapper {
            display: flex;
            position: relative;
            height: 100%;
            width: min(774px, 100%);
            justify-content: center;
        }

        .key {
            cursor: pointer;
            position: relative;
            transition: 0.1s;
            border: 0;
            font: inherit;
        }

        .white {
            width: 114px;
            height: 182px;
            background: linear-gradient(180deg, #fff8ed, #ead8bd);
            border-right: 2px solid rgba(36, 24, 12, 0.38);
            border-radius: 0 0 8px 8px;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 18px;
            color: #090909;
            font-size: 1.25rem;
            font-weight: 900;
            box-shadow: inset 0 -10px 16px rgba(117,75,35,0.16);
        }

        .black {
            width: 72px;
            height: 122px;
            background: linear-gradient(180deg, #1d2025, #030405 72%);
            z-index: 2;
            margin-left: -36px;
            margin-right: -36px;
            border-radius: 0 0 8px 8px;
            color: var(--gold-soft);
            font-size: 0.95rem;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 26px;
            font-weight: 900;
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 6px 0 #000, 0 12px 18px rgba(0,0,0,0.58);
        }

        .white.active {
            transform: translateY(6px);
            filter: brightness(1.08);
            box-shadow: inset 0 0 24px rgba(242,189,87,0.35);
        }

        .black.active {
            transform: translateY(5px);
            filter: brightness(1.18);
            box-shadow: 0 2px 0 #000, 0 8px 16px rgba(0,0,0,0.55);
        }

        .bottom-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 18px;
        }

        .status-pill {
            min-height: 56px;
            flex: 1;
            max-width: 380px;
            border-radius: 28px;
            background: rgba(9, 12, 16, 0.82);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-soft);
            font-weight: 800;
            text-align: center;
            padding: 12px 18px;
            font-size: 1rem;
        }

        .completion {
            flex: 1;
            display: grid;
            place-items: center;
            text-align: center;
            min-height: 430px;
        }

        .completion-badge {
            width: 108px;
            height: 108px;
            margin: 0 auto 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff7e8;
            background: radial-gradient(circle, rgba(255, 244, 225, 0.24), rgba(8, 9, 12, 0.96) 64%);
            border: 1px solid rgba(242, 189, 87, 0.72);
            box-shadow: 0 0 34px rgba(242, 189, 87, 0.24), inset 0 0 24px rgba(255, 244, 225, 0.08);
            font-size: 3rem;
        }

        .completion h2 {
            font-family: "Playfair Display", serif;
            color: var(--gold-soft);
            font-size: clamp(3.5rem, 7vw, 5.5rem);
            line-height: 0.95;
            margin-bottom: 20px;
        }

        .completion p {
            color: var(--muted);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 32px;
        }

        .completion strong {
            color: var(--gold-soft);
            font-weight: 900;
        }

        .completion-actions {
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .completion-btn {
            min-width: 172px;
            border: 1px solid rgba(242, 189, 87, 0.85);
            border-radius: 18px;
            padding: 18px 30px;
            color: #120c03;
            background: linear-gradient(135deg, #fff0ad, #f2bd57 58%, #c8892c);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.34), 0 0 28px rgba(242, 189, 87, 0.2);
            font: inherit;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .popup-card {
            background: #0d0d0d;
            border-radius: 40px;
            padding: 50px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #victory-card {
            border: 2px solid var(--gold);
            box-shadow: 0 0 60px rgba(240, 195, 77, 0.4);
        }

        #loss-card {
            border: 2px solid var(--red);
            box-shadow: 0 0 60px rgba(255, 77, 77, 0.3);
        }

        .trophy {
            font-size: 5rem;
            margin-bottom: 20px;
            color: var(--gold);
            filter: drop-shadow(0 0 20px var(--gold));
        }

        .broken-heart {
            font-size: 80px;
            margin-bottom: 20px;
            color: var(--red);
            filter: drop-shadow(0 0 15px var(--red));
        }

        .popup-card h1 {
            font-family: "Playfair Display", serif;
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .victory-text { color: var(--gold); }
        .loss-text { color: var(--red); }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        .main-action-btn,
        .secondary-btn {
            border-radius: 35px;
            font-family: Inter, sans-serif;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }

        .main-action-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 18px;
            font-size: 1.2rem;
        }

        .main-action-btn.red-btn {
            background: var(--red);
            color: #fff;
        }

        .secondary-btn {
            background: transparent;
            color: #e6d8bd;
            border: 1px solid rgba(242,189,87,0.4);
            padding: 12px;
        }

        @media (max-width: 1150px) {
            .topbar { grid-template-columns: 1fr; }
            .brand, .top-actions { justify-content: center; }
            .nav {
                width: 100%;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
            .scoreboard { grid-template-columns: repeat(2, 1fr); }
            .score-item { padding: 16px 20px; }
            .challenge-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .difficulty {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
            }
            .piano-wrapper { width: min(820px, 100%); }
            .white { width: 72px; height: 150px; }
            .black {
                width: 48px;
                height: 98px;
                margin-left: -24px;
                margin-right: -24px;
            }
            .bottom-row { flex-wrap: wrap; gap: 12px; }
            .status-pill { flex: 1 1 100%; max-width: none; }
        }

        @media (max-width: 760px) {
            body { padding: 8px 10px; }
            .brand-title { font-size: 2rem; }
            .nav-btn { padding: 10px 14px; font-size: 0.95rem; }
            .icon-btn { width: 52px; height: 52px; font-size: 1.15rem; }
            .score-item { min-height: 84px; padding: 12px 16px; }
            .badge { width: 56px; height: 56px; font-size: 1.7rem; }
            .challenge-title h1 { font-size: 2rem; }
            .challenge-title p, .instruction-main { font-size: 1rem; }
            .target-panel { height: 120px; padding: 12px 18px; }
            .staff-lines { left: 50px; right: 50px; height: 58px; }
            .clef { left: 80px; font-size: 4.2rem; }
            .white { width: 62px; height: 130px; font-size: 1.05rem; }
            .black {
                width: 42px;
                height: 92px;
                margin-left: -21px;
                margin-right: -21px;
                font-size: 0.82rem;
                padding-bottom: 18px;
            }
            .bottom-row { gap: 10px; }
            .status-pill { padding: 10px 14px; font-size: 0.95rem; }
        }

        @media (max-height: 820px) {
            body { padding: 10px 18px; }
            .stage { min-height: calc(100vh - 20px); gap: 10px; }
            .brand-mark, .icon-btn { width: 52px; height: 52px; }
            .brand-title { font-size: 2.5rem; }
            .score-item { min-height: 84px; padding: 14px 28px; }
            .badge { width: 58px; height: 58px; }
            .game-shell { padding: 28px 42px 20px; }
            .target-panel { height: 150px; margin-bottom: 14px; }
            .piano-container { min-height: 180px; }
            .white { width: 96px; height: 170px; }
            .black { width: 68px; height: 110px; }
            .challenge-title h1 { font-size: 2.4rem; }
            .challenge-title p { font-size: 1.1rem; }
            .bottom-row { flex-wrap: wrap; gap: 12px; }
            .status-pill { flex: 1 1 100%; }
        }
        .brand-mark,
        .brand-title,
        .brand-sub,
        .top-actions .icon-btn {
            font-size: 0;
        }

        .brand-mark::before {
            content: "\1D11E";
            font-size: 2rem;
        }

        .brand-title::before {
            content: "Pianova\266A";
            font-size: 2.8rem;
        }

        .brand-sub::before {
            content: "Play \2022  Learn \2022  Master";
            font-size: 1.05rem;
        }

        .top-actions .icon-btn::before {
            font-size: 1.35rem;
        }

        .top-actions .icon-btn:first-child::before {
            content: "\2302";
        }

        .top-actions .icon-btn:last-child::before {
            content: "\23FB";
        }
    </style>
</head>

<body>
    <div class="music-bg" aria-hidden="true">
        <span>&#119070;</span>
        <span>&#9835;</span>
        <span>&#9834;</span>
        <span>&#9836;</span>
    </div>

    <main class="stage">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">&#9637;</div>
                <div>
                    <div class="brand-title">Pianova&#9834;</div>
                    <div class="brand-sub">Play &bull; Learn &bull; Master</div>
                </div>
            </div>

            <div aria-hidden="true"></div>

            <div class="top-actions">
                <button class="icon-btn" title="Home" onclick="window.location.href='/lessons'">&#8962;</button>
                <button class="icon-btn" title="Exit" onclick="window.location.href='/'">&#9211;</button>
            </div>
        </header>

        <section class="scoreboard">
            <div class="score-item">
                <div class="badge">&#9733;</div>
                <div>
                    <div class="score-label">Score</div>
                    <div class="score-number" id="score-val">0</div>
                </div>
            </div>

            <div class="score-item">
                <div class="badge">&#9832;</div>
                <div>
                    <div class="score-label">Combo</div>
                    <div>
                        <span class="score-number" id="streak-val">0</span>
                        <span class="combo-text" id="combo-text">Keep going!</span>
                    </div>
                </div>
            </div>

            <div class="score-item">
                <div class="badge" style="border-color: rgba(255,83,104,.55);">&#9829;</div>
                <div>
                    <div class="score-label">Lives</div>
                    <div class="lives-row" id="lives-val">&#9829; &#9829; &#9829; &#9829; &#9829;</div>
                </div>
            </div>

            <div class="score-item">
                <div>
                    <div class="score-label">Level 1</div>
                    <div class="level-progress">
                        <div class="progress-track">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <strong id="progress-percent">0%</strong>
                    </div>
                </div>
            </div>
        </section>

        <section class="game-shell" id="game-frame">
            <div class="level-ribbon">Lesson 2</div>

            <div class="challenge-header">
                <div class="challenge-title">
                    <div class="mini-mark">&#9637;</div>
                    <div>
                        <h1>Pianova</h1>
                        <p>Repeat the triad sequence</p>
                    </div>
                </div>

                <button class="difficulty">&#9835; Lesson 2 &#709;</button>
            </div>

            <div class="instruction-main">Play the sequence shown on the staff</div>

            <div class="target-panel">
                <div class="target-card">
                    <div class="staff-lines"></div>
                    <div class="clef">&#119070;</div>
                    <div id="target-notes">...</div>
                </div>
            </div>

            <div class="piano-container">
                <div id="piano-rail" class="piano-wrapper"></div>
            </div>

            <div class="bottom-row">
                <div class="status-pill" id="status-text">Ready to play?</div>
            </div>
        </section>
    </main>

<script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    const freqs = {
        "C": 261.63, "C#": 277.18, "D": 293.66, "D#": 311.13, "E": 329.63,
        "F": 349.23, "F#": 369.99, "G": 392.00, "G#": 415.30, "A": 440.00,
        "A#": 466.16, "B": 493.88
    };

    const notesArr = Object.keys(freqs);

    let score = 0;
    let streak = 0;
    let lives = 5;
    let targetSeq = [];
    let userSeq = [];
    let waitingForReset = false;

    async function ensureAudioContext() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === "suspended") {
            await audioCtx.resume();
        }
        return audioCtx;
    }

    async function playNote(note, duration = 0.75, volume = 0.42) {
        const ctx = await ensureAudioContext();
        if (!freqs[note]) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freqs[note], now);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
    }

    async function playTone(freq, duration = 0.25, volume = 0.5, type = "sine") {
        const ctx = await ensureAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
    }

    async function playCorrectSound() {
        await playTone(523.25, 0.18, 0.5, "sine");
        setTimeout(() => playTone(659.25, 0.2, 0.5, "sine"), 90);
        setTimeout(() => playTone(783.99, 0.24, 0.5, "sine"), 180);
    }

    async function playWrongSound() {
        await playTone(180, 0.18, 0.58, "sawtooth");
        setTimeout(() => playTone(130, 0.22, 0.5, "sawtooth"), 120);
    }

    function playVictorySound() {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, index) => {
            setTimeout(() => playTone(freq, 0.28, 0.5, "triangle"), index * 130);
        });
    }

    function playLossSound() {
        [300, 230, 170].forEach((freq, index) => {
            setTimeout(() => playTone(freq, 0.28, 0.55, "sawtooth"), index * 150);
        });
    }

    function nextRound() {
        if (waitingForReset) return;
        userSeq = [];
        targetSeq = [];
        for (let i = 0; i < 3; i++) {
            targetSeq.push(notesArr[Math.floor(Math.random() * notesArr.length)]);
        }
        document.getElementById("target-notes").innerText = targetSeq.join("   ");
        document.getElementById("status-text").innerText = "Play the 3 notes";
    }

    async function checkAnswer() {
        if (waitingForReset) return;
        if (userSeq.length === 0) {
            document.getElementById("status-text").innerText = "Wrong answer! Play 3 notes first.";
            playWrongSound();
            return;
        }
        if (userSeq.length < 3) {
            document.getElementById("status-text").innerText = "Wrong answer! Complete the triad.";
            playWrongSound();
            return;
        }
        if (userSeq.join(",") === targetSeq.join(",")) {
            score += 10;
            streak++;
            document.getElementById("status-text").innerText = "Correct answer! Great job.";
            playCorrectSound();
            updateUI();
            if (score >= 100) {
                playVictorySound();
                waitingForReset = true;
                showCompletion(true);
                return;
            }
            setTimeout(() => { if (!waitingForReset) nextRound(); }, 450);
        } else {
            lives--;
            streak = 0;
            document.getElementById("status-text").innerText = "Wrong answer! Try the next triad.";
            playWrongSound();
            updateUI();
            if (lives <= 0) {
                playLossSound();
                waitingForReset = true;
                showCompletion(false);
                return;
            }
            setTimeout(() => { if (!waitingForReset) nextRound(); }, 800);
        }
        updateUI();
    }

    function showCompletion(won) {
        const gameFrame = document.getElementById("game-frame");
        const icon = won ? "&#9733;" : "&#9829;";
        const title = won ? "Maestro!" : "Try Again";

        gameFrame.innerHTML = `
            <section class="completion">
                <div>
                    <div class="completion-badge">${icon}</div>
                    <h2>${title}</h2>
                    <p>Final score: <strong>${score} / 100</strong></p>
                    <div class="completion-actions">
                        ${won ? `<button class="completion-btn" onclick="window.location.href='${window.location.protocol.startsWith('http') ? '/lesson2-3' : 'level2(lesson 3).html'}'">Next Lesson</button>` : `<button class="completion-btn" onclick="location.reload()">Play Again</button>`}
                    </div>
                </div>
            </section>
        `;
    }

    function renderLives() {
        let output = "";
        for (let i = 0; i < 5; i++) {
            output += i < lives ? "&#9829; " : "&#9825; ";
        }
        return output.trim();
    }

    function updateUI() {
        const percent = Math.round((score / 100) * 100);
        document.getElementById("score-val").innerText = score;
        document.getElementById("streak-val").innerText = streak;
        document.getElementById("combo-text").innerText = streak >= 3 ? "Perfect!" : "Keep going!";
        document.getElementById("lives-val").innerHTML = renderLives();
        document.getElementById("progress-fill").style.width = percent + "%";
        document.getElementById("progress-percent").innerText = percent + "%";
    }

    const rail = document.getElementById("piano-rail");

    notesArr.forEach(note => {
        const key = document.createElement("button");
        key.type = "button";
        key.className = `key ${note.includes("#") ? "black" : "white"}`;
        key.innerText = note;

        const handlePress = async (e) => {
            e.preventDefault();
            if (waitingForReset) return;
            await playNote(note);
            if (userSeq.length < 3 && !waitingForReset) {
                userSeq.push(note);
                if (userSeq.length === 3) {
                    setTimeout(() => checkAnswer(), 80);
                }
            }
            key.classList.add("active");
            setTimeout(() => key.classList.remove("active"), 150);
        };

        key.onmousedown = handlePress;
        key.ontouchstart = handlePress;
        rail.appendChild(key);
    });

    nextRound();
    updateUI();

    (function () {
        const stage = document.querySelector(".stage");
        if (!stage) return;
        function fit() {
            stage.style.transform = "none";
            const viewportH = window.innerHeight || document.documentElement.clientHeight;
            const height = stage.getBoundingClientRect().height || stage.offsetHeight;
            if (!height) return;
            let scale = 1;
            if (height > viewportH) {
                scale = viewportH / height;
                scale = Math.max(0.5, scale);
            }
            scale = Math.min(1, scale);
            stage.style.transform = "scale(" + scale + ")";
            stage.style.transformOrigin = "top center";
        }
        window.addEventListener("resize", fit);
        setTimeout(fit, 80);
        setTimeout(fit, 350);
    })();
</script>
</body>
</html>
