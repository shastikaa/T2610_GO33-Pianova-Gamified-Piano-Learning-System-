<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pianova - Triad Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #f0c34d;
            --bg-black: #000000;
            --card-bg: rgba(13, 13, 13, 0.85); 
            --border-gray: #262626;
            --red: #ff4d4d;
            --blue: #4d79ff;
            --green: #4dff88;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-black); color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        .main-container { display: flex; gap: 20px; height: 85vh; width: 95vw; max-width: 1400px; z-index: 10; }

        .sidebar, .info-sidebar { display: flex; flex-direction: column; gap: 12px; width: 180px; }

        .stat-card, .info-box {
            background: var(--card-bg); border: 1px solid var(--border-gray); border-radius: 15px; padding: 20px; flex: 1;
            display: flex; flex-direction: column; justify-content: center; backdrop-filter: blur(8px);
            animation: ultraSmoothFloat 6s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite;
        }

        @keyframes ultraSmoothFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }

        .stat-label { font-family: 'Montserrat'; font-size: 0.65rem; color: var(--gold); text-transform: uppercase; }
        .stat-value { font-family: 'Montserrat'; font-size: 2rem; font-weight: 900; text-align: right; }

        .game-frame { flex: 1; border: 1px solid var(--gold); background: rgba(8, 8, 8, 0.9); padding: 30px; border-radius: 30px; display: flex; flex-direction: column; gap: 20px; backdrop-filter: blur(12px); transition: filter 0.5s ease; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-family: 'Montserrat'; font-size: 2.2rem; font-weight: 900; color: var(--gold); }

        .target-display { background: #fff; border-radius: 25px; flex: 2; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 40px rgba(0,0,0,0.1); }
        #target-notes { color: #000; font-size: 3rem; font-weight: 900; font-family: 'Montserrat'; letter-spacing: 8px; }

        .piano-container { background: #000; padding: 20px; border-radius: 20px; display: flex; justify-content: center; flex: 1.5; }
        .piano-wrapper { display: flex; position: relative; height: 100%; }
        
        .key { cursor: pointer; user-select: none; position: relative; transition: 0.1s; }
        .white { width: 60px; height: 100%; background: #e0e0e0; border: 1px solid #999; border-radius: 0 0 8px 8px; z-index: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; color: #333; font-weight: 700; box-shadow: inset 0 -8px 0 #bbb; }
        .black { width: 38px; height: 60%; background: #222; z-index: 2; margin-left: -19px; margin-right: -19px; border-radius: 0 0 5px 5px; color: #fff; font-size: 0.65rem; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; }
        .white.active { background: #fff; transform: translateY(4px); box-shadow: none; }
        .black.active { background: #444; transform: translateY(4px); }

        .submit-btn { background: var(--gold); color: #000; border: none; padding: 16px; border-radius: 30px; font-family: 'Montserrat'; font-weight: 800; cursor: pointer; font-size: 1rem; margin-top: auto; transition: 0.2s; }
        .submit-btn:hover { background: #fff; transform: translateY(-2px); }

        /* --- END SCREENS (Popups) --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.92); backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; transition: opacity 0.5s ease;
        }

        .popup-card {
            background: #0d0d0d; border-radius: 40px; padding: 50px; text-align: center; max-width: 550px; width: 90%;
            transform: scale(0.8); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Victory Theme */
        #victory-card { border: 2px solid var(--gold); box-shadow: 0 0 60px rgba(240, 195, 77, 0.4); }
        /* Loss Theme */
        #loss-card { border: 2px solid var(--red); box-shadow: 0 0 60px rgba(255, 77, 77, 0.3); }

        .trophy-img { width: 120px; margin-bottom: 20px; filter: drop-shadow(0 0 20px var(--gold)); }
        .broken-heart { font-size: 80px; margin-bottom: 20px; color: var(--red); filter: drop-shadow(0 0 15px var(--red)); }

        .popup-card h1 { font-family: 'Montserrat'; font-size: 3.5rem; margin-bottom: 10px; }
        .victory-text { color: var(--gold); }
        .loss-text { color: var(--red); }

        .button-group { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }

        .main-action-btn {
            background: var(--gold); color: #000; border: none; padding: 18px; border-radius: 35px;
            font-family: 'Montserrat'; font-weight: 800; cursor: pointer; font-size: 1.2rem; transition: 0.3s;
        }
        .main-action-btn.red-btn { background: var(--red); color: #fff; }
        .main-action-btn:hover { transform: scale(1.05); filter: brightness(1.2); }

        .secondary-btn {
            background: transparent; color: #aaa; border: 1px solid #333; padding: 12px; border-radius: 35px;
            font-family: 'Montserrat'; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .secondary-btn:hover { color: #fff; border-color: #fff; }

    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div id="victory-overlay" class="overlay">
        <div id="victory-card" class="popup-card">
            <img src="http://googleusercontent.com/image_collection/image_retrieval/18148648490547475493_0" class="trophy-img" alt="Victory Trophy">
            <h1 class="victory-text">PERFECT!</h1>
            <p>You have mastered the staff with 10/10!</p>
            <div class="button-group">
                <button class="main-action-btn" onclick="location.reload()">NEXT LEVEL</button>
                <button class="secondary-btn" onclick="location.reload()">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <div id="loss-overlay" class="overlay">
        <div id="loss-card" class="popup-card">
            <div class="broken-heart">💔</div>
            <h1 class="loss-text">YOU LOST</h1>
            <p>Don't give up! Your musical journey is just starting.</p>
            <div class="button-group">
                <button class="main-action-btn red-btn" onclick="location.reload()">TRY AGAIN</button>
                <button class="secondary-btn" onclick="location.reload()">MAIN MENU</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="stat-card"><span class="stat-label">Score</span><span class="stat-value" id="score-val">0/10</span></div>
            <div class="stat-card"><span class="stat-label">Points</span><span class="stat-value" id="points-val" style="color:var(--gold)">0</span></div>
            <div class="stat-card"><span class="stat-label">Streak</span><span class="stat-value" id="streak-val">🔥 0</span></div>
            <div class="stat-card"><span class="stat-label">Lives</span><span class="stat-value" id="lives-val">💖 5</span></div>
        </div>

        <div class="game-frame" id="game-frame">
            <div class="header-bar">
                <div class="logo-text">PIANOVA</div>
                <button class="secondary-btn" style="padding: 5px 15px; font-size: 0.7rem;" onclick="location.reload()">QUIT</button>
            </div>
            <div style="font-size: 1.1rem; opacity: 0.7;">Play the sequence:</div>
            <div class="target-display"><div id="target-notes">...</div></div>
            <div class="piano-container"><div id="piano-rail" class="piano-wrapper"></div></div>
            <button class="submit-btn" onclick="checkAnswer()">SUBMIT TRIAD</button>
        </div>

        <div class="info-sidebar">
            <div class="info-box" style="border-color:var(--blue)"><span class="info-label" style="color:var(--blue)">Status</span><p id="status-text" style="font-size:0.8rem">Ready to play?</p></div>
            <div class="info-box" style="border-color:var(--green)"><span class="info-label" style="color:var(--green)">Input</span><p id="user-input-display" style="font-size:1.1rem; font-weight:bold;">-</p></div>
        </div>
    </div>

<script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    const freqs = {"C":261.6,"C#":277.2,"D":293.7,"D#":311.1,"E":329.6,"F":349.2,"F#":370.0,"G":392.0,"G#":415.3,"A":440.0,"A#":466.2,"B":493.9};
    const notesArr = Object.keys(freqs);

    let score = 0, points = 0, streak = 0, lives = 5, targetSeq = [], userSeq = [];

    function playNote(note) {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freqs[note], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.8);
    }

    function nextRound() {
        userSeq = [];
        updateInputDisplay();
        targetSeq = [];
        for(let i=0; i<3; i++) targetSeq.push(notesArr[Math.floor(Math.random()*notesArr.length)]);
        document.getElementById('target-notes').innerText = targetSeq.join(' ');
    }

    function updateInputDisplay() {
        document.getElementById('user-input-display').innerText = userSeq.length > 0 ? userSeq.join(' ') : "-";
    }

    function checkAnswer() {
        if (userSeq.length === 0) return;
        if (userSeq.join(',') === targetSeq.join(',')) {
            score++; points += 250; streak++;
            document.getElementById('status-text').innerText = "Correct! +250";
            if(score >= 10) showPopup('victory-overlay');
        } else {
            lives--; streak = 0;
            document.getElementById('status-text').innerText = "Wrong sequence!";
            if(lives <= 0) showPopup('loss-overlay');
        }
        updateUI();
        if(score < 10 && lives > 0) nextRound();
    }

    function showPopup(id) {
        const overlay = document.getElementById(id);
        document.getElementById('game-frame').style.filter = "blur(5px)";
        overlay.style.display = 'flex';
        setTimeout(() => {
            overlay.style.opacity = '1';
            overlay.querySelector('.popup-card').style.transform = 'scale(1)';
        }, 10);
    }

    function updateUI() {
        document.getElementById('score-val').innerText = `${score}/10`;
        document.getElementById('points-val').innerText = points;
        document.getElementById('streak-val').innerText = `🔥 ${streak}`;
        document.getElementById('lives-val').innerText = `💖 ${lives}`;
    }

    const rail = document.getElementById('piano-rail');
    notesArr.forEach(note => {
        const key = document.createElement('div');
        key.className = `key ${note.includes('#') ? 'black' : 'white'}`;
        key.innerText = note;
        key.onmousedown = () => {
            playNote(note);
            if(userSeq.length < 3) { userSeq.push(note); updateInputDisplay(); }
            key.classList.add('active');
            setTimeout(() => key.classList.remove('active'), 150);
        };
        rail.appendChild(key);
    });

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let bgNotes = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    class BNote {
        constructor() { this.reset(); this.y = Math.random() * canvas.height; }
        reset() { this.x = Math.random() * canvas.width; this.y = -50; this.speed = 0.5 + Math.random(); this.opacity = 0.1; this.size = 20; }
        draw() { ctx.globalAlpha = this.opacity; ctx.fillStyle = "#f0c34d"; ctx.font = "20px serif"; ctx.fillText('♪', this.x, this.y); this.y += this.speed; if (this.y > canvas.height + 50) this.reset(); }
    }
    for(let i=0; i<60; i++) bgNotes.push(new BNote());
    function loop() { ctx.clearRect(0,0,canvas.width,canvas.height); bgNotes.forEach(n => n.draw()); requestAnimationFrame(loop); }
    window.addEventListener('resize', resize); resize(); loop(); nextRound(); updateUI();
</script>
</body>
</html>
